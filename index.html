.zb{position:relative;width:390px;max-width:100%;aspect-ratio:130/84;align-self:center;margin-top:9px}

ziców wraca czwartek."}}}, {"id": "d2", "nr": 2, "dzien": "wtorek", "godz": "19:10", "dalej": "Środa, 8:00", "tag": null, "opis": "", "kto": null, "scena": [["n", "Kuba wyszedł godzinę temu."], ["n", "Otwierasz jego dokumentację. Kursor miga w pustym polu."], ["n", "Co zostanie na piśmie?"]], "split": false, "prompt": null, "art": "d2", "art_dec": "d2", "kadr": [124, 40], "pomoc": {"tytul": "Kto może kiedyś przeczytać tę notatkę?", "fakty": [["Rodzice.", "W poradni dokumentację udostępnia się „pacjentowi lub jego przedstawicielowi ustawowemu” (art. 26 ust. 1 ustawy o prawach pacjenta). W szkole rodzice mają wgląd do dziennika elektronicznego „w zakresie dotyczącym ich dzieci” (§ 21 ust. 3 pkt 5 rozp. MEN).", ""], ["Sąd i prokurator.", "Dokument z tajemnicą zawodową trafia do nich „w opieczętowanym opakowaniu”.", "art. 225 § 1 KPK"]], "pasek": null}, "opcje": [{"k": "A", "t": "Nic.", "kr": "Nic", "czyn": true}, {"k": "B", "t": "Wszystko, jego słowami. Także sprzedaż i susz taty.", "kr": "Wszystko", "czyn": true}, {"k": "C", "t": "Minimum w dokumentacji: „odbyła się sesja”. Reszta w prywatnym zeszycie.", "kr": "Minimum + zeszyt", "czyn": true}, {"k": "D", "t": "Jak często pali, plan jazdy, twoje ostrzeżenia. Bez jego przyznania się do czynów.", "kr": "Kliniczne, bez czynów", "czyn": true}], "skutek": {"A": [["n", "Zamykasz plik. Pusty. Jeśli ktoś kiedyś zapyta, co było wiadomo we wtorek, odpowiedź będzie tylko w twojej pamięci."]], "B": [["n", "Trzy akapity. Jego słowa, w cudzysłowach. Zapisujesz. Plik ma teraz datę, godzinę i twoje nazwisko."]], "C": [["n", "W systemie jedno zdanie. W szufladzie zeszyt w kratkę, dwie strony drobnym pismem. Przekręcasz kluczyk."]], "D": [["n", "Pięć zdań. Częstotliwość, plan na piątek, to, co mu mówisz o ryzyku. Słowa „sprzedaję” w notatce nie ma."]]}, "art_sk": {"A": "d2", "B": "d2", "C": "d2", "D": "d2"}, "kol": "miejsca", "oceny": {"A": {"S": "no", "P": "no", "G": "ok", "K": "no"}, "B": {"S": "q", "P": "no", "G": "ok", "K": "no"}, "C": {"S": "q", "P": "q", "G": "ok", "K": "q"}, "D": {"S": "ok", "P": "ok", "G": "ok", "K": "ok"}}, "podstawy": {"A": {"S": "Do dziennika psychologa wpisuje się „zajęcia i czynności przeprowadzone w poszczególnych dniach” (§ 18 rozp. MEN o dokumentacji).", "P": "„Wpisu w dokumentacji dokonuje się niezwłocznie po udzieleniu świadczenia zdrowotnego” (§ 4 ust. 1 rozp. MZ); art. 24 ust. 1 ustawy o prawach pacjenta.", "G": "Ustawa z 2001 r. nie zna obowiązku dokumentacji. Od 19.05.2028 dokumentacja będzie obowiązkowa (art. 28 ust. 1 nowej ustawy).", "K": "Jeśli ktoś zapyta, co było wiadomo we wtorek, zostaje tylko twoja pamięć. Kodeks Etyczny, 11.3.a: psycholog „w sposób odpowiedzialny i rzetelny zarządza informacjami”."}, "B": {"S": "Sprawa otwarta: dziennik psychologa ma określoną zawartość (§ 18 rozp. MEN), a do dziennika elektronicznego mają wgląd rodzice (§ 21 ust. 3 pkt 5).", "P": "Zakazane wprost: w dokumentacji leczenia „nie utrwala się oświadczeń obejmujących przyznanie się do popełnienia czynu zabronionego” (art. 51 u.o.z.p.).", "G": "Żaden przepis tego nie zakazuje.", "K": "Przyznanie się Kuby zostaje na piśmie, z datą i twoim nazwiskiem. Notatkę mogą kiedyś przeczytać rodzice, sąd i prokurator."}, "C": {"S": "Czy prywatny zeszyt jest „dokumentacją”: nierozstrzygnięte.", "P": "Czy prywatny zeszyt jest „dokumentacją”: nierozstrzygnięte.", "G": "Dziś wolno. Od 19.05.2028 notatki robocze są wyłączone z dostępu klienta (art. 28 ust. 4 nowej ustawy), ale należą do „wszystkich materiałów” (art. 2 pkt 1).", "K": "Sprawa otwarta: zeszyt z szuflady też jest rzeczą, którą trzeba wydać na żądanie sądu lub prokuratora (art. 217 § 1 KPK)."}, "D": {"S": "Wpis o czynnościach jest (§ 18 rozp. MEN). Treści rozmów przepis nie wymaga.", "P": "Wpis jest (§ 4 ust. 1 rozp. MZ), a przyznania się do czynu nie ma (art. 51 u.o.z.p.).", "G": "Żaden przepis tego nie zakazuje.", "K": "Kodeks Etyczny, 11.3.a: rzetelne zarządzanie informacjami. Koszt: plan jazdy po paleniu jest w dokumentacji."}}}, {"id": "d3", "nr": 3, "dzien": "czwartek", "godz": "12:15", "dalej": "Piątek, 21:40", "tag": ["Mama Kuby", "szyba"], "opis": "Dzwoni.", "kto": "Mama Kuby", "scena": [["m", "— Znalazłam w jego plecaku pudełko wkładów do e-papierosa."], ["m", "I mężowi ubywa leku z apteki, tego na receptę."], ["m", "— Czy on coś bierze? Mam zamknąć leki męża?"]], "split": true, "akcja": "Odpowiedz mamie", "prompt": [["m", "— Czy on coś bierze? Mam zamknąć leki męża?"]], "art": "d3", "art_dec": "d3", "kadr": [124, 40], "pomoc": {"tytul": "Co wolno wiedzieć rodzicowi siedemnastolatka?", "fakty": [["Zależy od miejsca.", "Poradnia: rodzic ma prawo do informacji o stanie zdrowia (art. 9 ust. 2 ustawy o prawach pacjenta). Szkoła: rodziców informuje się o potrzebie pomocy (§ 23 ust. 1 rozp. MEN). Gabinet: ustawa z 2001 r. o rodzicach nie mówi nic.", ""], ["Lek męża to susz konopi na receptę.", "Dla Kuby wzięcie go to posiadanie środka odurzającego (art. 62 u.p.n.) i jego zabór (art. 64 u.p.n.: od 3 miesięcy do 5 lat).", ""]], "pasek": null}, "opcje": [{"k": "A", "t": "„O tym, co mówi Kuba, nie mogę rozmawiać.”", "kr": "„Nie mogę rozmawiać”"}, {"k": "B", "t": "„Nie przez telefon. Proszę przyjść razem z Kubą.”", "kr": "„Nie przez telefon, razem z Kubą”"}, {"k": "C", "t": "Mówisz jej wszystko, co wiesz.", "kr": "Mówię wszystko", "czyn": true}, {"k": "D", "t": "„Leki zawsze warto trzymać pod zamknięciem.”", "n": "Nic więcej.", "kr": "„Leki pod zamknięciem”"}], "skutek": {"A": [["m", "— Rozumiem — mówi mama."], ["d", "Nie rozumie. Rozłącza się. Zostaje z pudełkiem wkładów w ręce i szafką, której nikt nie zamknął."]], "B": [["d", "Umawiacie wtorek, 16:00. Na pytanie o leki nie pada odpowiedź. Do wtorku pojemnik z suszem stoi tam, gdzie stał."]], "C": [["d", "Mama milczy przez całą twoją wypowiedź."], ["m", "— Dziękuję — mówi na końcu."], ["d", "Wieczorem Kuba dowie się wszystkiego. Od niej."]], "D": [["m", "— Czyli tak — mówi mama cicho."], ["d", "Niczego nie potwierdzasz. Wieczorem szafka w sypialni ma kłódkę. Kuba ją zauważa."]]}, "art_sk": {"A": "d3", "B": "d3", "C": "d3", "D": "d3"}, "kol": "prawo", "oceny": {"A": {"L": "q", "K": "q"}, "B": {"L": "ok", "K": "ok"}, "C": {"L": "q", "K": "no"}, "D": {"L": "q", "K": "q"}}, "podstawy": {"A": {"L": "Sprawa otwarta. W poradni rodzic ma prawo do „przystępnej informacji o stanie zdrowia pacjenta” (art. 9 ust. 2 ustawy o prawach pacjenta). Oba stanowiska literatury dopuszczają przekazanie rodzicom co najmniej wniosków.", "K": "Sprawa otwarta: Kuba zachowuje zaufanie, ale lek ojca zostaje niezamknięty."}, "B": {"L": "Tożsamości rozmówcy przez telefon nie da się potwierdzić. Sobczak i Straburzyński (2015): informacje przekazuje się rodzicom co do zasady w obecności dziecka.", "K": "Kuba jest przy rozmowie o sobie. Koszt: do wtorku pojemnik z suszem stoi tam, gdzie stał."}, "C": {"L": "Sprawa otwarta: Kmieciak (2026) — prawo nie przewiduje tajemnicy przed rodzicami dziecka; opinia prawna PTP (2017) — rodzice nie mogą żądać wszystkich informacji.", "K": "Informacje przekazuje się „wyłącznie w niezbędnym zakresie” (art. 14 ust. 2b ustawy o prawach pacjenta). Kodeks Etyczny, 11.3.c: o zakresie decyduje psycholog, „kierując się przede wszystkim celem”."}, "D": {"L": "To pośrednie potwierdzenie. Czy wobec rodziców obowiązuje tajemnica: literatura jest podzielona.", "K": "Sprawa otwarta: lek jest zamknięty, ale Kuba zauważa kłódkę i nie wie, kto co powiedział."}}}, {"id": "d4", "nr": 4, "dzien": "piątek", "godz": "21:40", "dalej": "Poniedziałek, 9:05", "tag": ["SMS od Kuby", "bordo"], "opis": "", "kto": "Kuba", "scena": [["sms", "Wiem, że mama do ciebie dzwoniła. Jadę autem taty na osiemnastkę, biorę Bartka. Dwa buchy, luz. Nie dzwoń do niej."]], "split": false, "prompt": null, "art": "d4", "art_dec": "d4", "kadr": [96, 38], "pomoc": {"tytul": "Co wiesz o 21:40", "fakty": [["Stan kierowcy.", "„Kto, znajdując się w stanie nietrzeźwości lub pod wpływem środka odurzającego, prowadzi pojazd mechaniczny […] podlega karze pozbawienia wolności do lat 3.”", "art. 178a § 1 KK. Progu dla THC ustawa nie podaje."], ["Tajemnica.", "Nie stosuje się jej, gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób”. Przepis pozwala. Nie nakazuje.", "art. 14 ust. 3 pkt 1 ustawy z 2001 r."]], "pasek": ["Sama jazda jest legalna: Kuba ma prawo jazdy od maja, Bartek jest pełnoletni.", "info"]}, "opcje": [{"k": "A", "t": "Dzwonię na 112.", "kr": "Dzwonię na 112", "czyn": true}, {"k": "B", "t": "Dzwonię do Kuby.", "kr": "Dzwonię do Kuby", "czyn": true}, {"k": "C", "t": "Odkładam telefon. Porozmawiamy we wtorek.", "kr": "Odkładam telefon", "czyn": true}, {"k": "D", "t": "Dzwonię do jego mamy.", "kr": "Dzwonię do mamy", "czyn": true}], "skutek": {"A": [["n", "Mówisz dyspozytorowi, kto jedzie, skąd i w jakim może być stanie. Rozłączasz się. Ręka ci drży."]], "B": [["n", "Odbiera po trzecim sygnale. Mówisz krótko: zatrzymaj się, zostaw auto, weź taksówkę."], ["m", "— Zobaczę — mówi."], ["n", "Rozłącza się."]], "C": [["n", "Ekran gaśnie. Kładziesz telefon ekranem do dołu."]], "D": [["n", "Mama odbiera od razu. Mówisz jedno zdanie: Kuba jedzie autem i nie powinien prowadzić."], ["m", "— Przecież jest u kolegi…"], ["n", "Rozłącza się, żeby do niego zadzwonić."]]}, "art_sk": {"A": "d4", "B": "d4", "C": "d4", "D": "d4"}, "los": {"F1": {"kiedy": "Sobota, 8:10", "kto": "SMS od Kuby", "sms": "Zatrzymali mnie 400 metrów od domu. Test na plus. Pobrali krew. Zabrali prawko.", "nazwa": "kontrola", "A": "Patrol stał na jego trasie.", "D": ""}, "F2": {"kiedy": "Sobota, 6:40", "kto": "Dzwoni mama Kuby", "tekst": "Płacze. Rondo przy wylotówce. Kuba ma złamany obojczyk. Bartek nie czuje nóg.", "nazwa": "wypadek", "A": "Patrol nie zdążył.", "D": "Mama dodzwoniła się o 21:52. Nie zawrócił."}, "F3": {"kiedy": "Piątek, 23:10", "kto": "SMS od Kuby", "sms": "Jestem w domu. Widzisz? Nic się nie stało.", "nazwa": "powrót", "A": "Patrol go nie znalazł.", "D": "Mama dodzwoniła się o 21:52."}}, "kol": "prawo", "oceny": {"A": {"L": "ok", "K": "q"}, "B": {"L": "ok", "K": "q"}, "C": {"L": "ok", "K": "no"}, "D": {"L": "ok", "K": "q"}}, "podstawy": {"A": {"L": "Tajemnicy nie stosuje się, gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób” (art. 14 ust. 3 pkt 1 ustawy z 2001 r.). Mówisz tylko o jeździe. Słowo „poważnie” ocenia psycholog.", "LP": "W poradni: zachowanie tajemnicy „może stanowić niebezpieczeństwo dla życia lub zdrowia pacjenta lub innych osób” (art. 14 ust. 2 pkt 2 ustawy o prawach pacjenta). Mówisz tylko o jeździe: „wyłącznie w niezbędnym zakresie” (ust. 2b).", "K": "Sprawa otwarta: telefon może uratować życie i skończyć się zarzutem dla Kuby."}, "B": {"L": "Rozmowa z klientem nie narusza żadnego przepisu.", "K": "Sprawa otwarta: może ocalić zaufanie i nie zatrzymać auta."}, "C": {"L": "W Polsce nie ma przepisu, który każe psychologowi ostrzec (Tarasoff 1976 to prawo Kalifornii).", "K": "Kodeks Etyczny, 5.1: chronić dobro odbiorcy, „unikając szkody (primum non nocere)”."}, "D": {"L": "Tajemnicy nie stosuje się, gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób” (art. 14 ust. 3 pkt 1 ustawy z 2001 r.). Mówisz tylko o jeździe.", "LP": "W poradni: art. 14 ust. 2 pkt 2 ustawy o prawach pacjenta; tylko o jeździe: „wyłącznie w niezbędnym zakresie” (ust. 2b).", "K": "Sprawa otwarta: mama może go zatrzymać albo nie zdążyć."}}}, {"id": "d5", "nr": 5, "dzien": "poniedziałek", "godz": "9:05", "dalej": "Wtorek, 16:40", "tag": ["W drzwiach policjant.", "mundur"], "opis": "", "kto": null, "scena": [["n", "W piątek nauczyciel znalazł u pierwszoklasisty wkłady z HHCP-O."], ["n", "Chłopak kupił je w czwartek. Od Kuby."], ["n", "Mama Kuby powiedziała, że syn chodzi do ciebie."], ["n", "Prokurator żąda dokumentacji Kuby i wzywa cię na świadka. Środa, 10:00."]], "scena_S": ["d", "Za policjantem stoi dyrektor. Patrzy na ciebie."], "split": true, "akcja": "Odpowiedz policjantowi", "prompt": [["n", "Prokurator żąda dokumentacji Kuby i wzywa cię na świadka. Środa, 10:00."]], "art": "d5", "art_dec": "d5", "kadr": [119, 10], "pomoc": {"tytul": "Zanim odpowiesz policjantowi", "fakty": [["Zeznania.", "Psycholog może odmówić zeznań co do tajemnicy zawodowej, „chyba że sąd lub prokurator dla dobra wymiaru sprawiedliwości zwolni te osoby od obowiązku zachowania tajemnicy”.", "art. 180 § 1 KPK"], ["Dokumenty.", "Dokumenty z tajemnicą zawodową przekazuje się „w opieczętowanym opakowaniu”, bez odczytania.", "art. 225 § 1 KPK"]], "pasek": null}, "opcje": [{"k": "A", "t": "Odmawiam. Także wtedy, gdy mnie zwolnią z tajemnicy.", "kr": "Odmawiam także po zwolnieniu", "czyn": true}, {"k": "B", "t": "Wydaję dokumentację i zeznaję. To prokurator.", "kr": "Wydaję i zeznaję", "czyn": true}, {"k": "C", "t": "Niszczę notatkę.", "t0": "Odpisuję, że nie mam żadnej dokumentacji.", "kr": "Niszczę notatkę", "czyn": true}, {"k": "D", "t": "Odpisuję: tajemnica zawodowa. Proszę o postanowienie. Dokumenty — w opieczętowanej kopercie.", "kr": "Proszę o postanowienie", "czyn": true}], "skutek": {"A_SG": [["n", "Środa, 10:00. Prokurator wydaje postanowienie o zwolnieniu z tajemnicy."], ["m", "— Odmawiam — powtarzasz."], ["n", "Dwa tygodnie później: kara porządkowa, 3000 zł, i pouczenie o areszcie do 30 dni."]], "A_P": [["n", "Środa, 10:00."], ["m", "— Odmawiam."], ["n", "Prokurator sięga po ustawę. Czyta artykuł 52. Zamyka akta."], ["m", "— Nie mam pytań."]], "B": [["n", "Podpisujesz protokół wydania. W środę zeznajesz czterdzieści minut. Wszystko, co mówił Kuba, jest teraz w aktach — twoimi słowami."]], "C": [["n", "Niszczarka pracuje sześć sekund. W środę prokurator pyta o dokumentację. Odpowiadasz, że jej nie ma. Pyta, od kiedy."]], "C0": [["n", "Odpisujesz zgodnie z prawdą: dokumentacji nie ma. W środę jedynym dowodem jesteś ty."]], "D_SG": [["n", "Koperta, pieczęć, podpis. Dwa dni później przychodzi postanowienie: prokurator zwalnia cię z tajemnicy. W środę zeznajesz. Kuba przeczyta to w aktach."]], "D_P": [["n", "Koperta, pieczęć, podpis. W środę odpowiadasz na pytania o przebieg leczenia. Na pytanie, co Kuba mówił o sprzedaży, powołujesz artykuł 52. Prokurator przechodzi do następnego pytania."]]}, "notatka": {"B": "W dokumentacji są jego słowa o sprzedaży i o piątku.", "D": "W dokumentacji jest pięć zdań. Jedno o planie jazdy po paleniu.", "C": "Zeszyt z szuflady też jest rzeczą, którą trzeba wydać na żądanie.", "A": "Nie ma czego wydać."}, "art_sk": {"A": "d5", "B": "d5", "C": "d5", "D": "d5"}, "kol": "miejsca", "oceny": {"A": {"S": "no", "P": "ok", "G": "no", "K": "ok"}, "B": {"S": "no", "P": "no", "G": "no", "K": "no"}, "C": {"S": "no", "P": "no", "G": "no", "K": "q"}, "D": {"S": "ok", "P": "ok", "G": "ok", "K": "ok"}, "C0": {"S": "no", "P": "no", "G": "ok", "K": "q"}}, "podstawy": {"A": {"S": "Po zwolnieniu z tajemnicy odmowa jest bezpodstawna: kara pieniężna do 3000 zł, przy uporze aresztowanie do 30 dni (art. 287 § 1–2 w zw. z art. 285 § 1 KPK).", "G": "Po zwolnieniu z tajemnicy odmowa jest bezpodstawna: kara pieniężna do 3000 zł, przy uporze aresztowanie do 30 dni (art. 287 § 1–2 w zw. z art. 285 § 1 KPK).", "P": "„Nie wolno przesłuchiwać osób obowiązanych do zachowania tajemnicy […] jako świadków na okoliczność wypowiedzi osoby […] co do popełnienia przez nią czynu zabronionego pod groźbą kary.” (art. 52 ust. 1 u.o.z.p.) Tego zakazu nie uchyla prokurator ani sąd.", "K": "Słowa Kuby o sprzedaży nie trafiają do akt z twoich ust."}, "B": {"S": "Bez zwolnienia z tajemnicy to ujawnienie wbrew ustawie (art. 14 ustawy z 2001 r.; art. 266 § 1 KK).", "G": "Bez zwolnienia z tajemnicy to ujawnienie wbrew ustawie (art. 14 ustawy z 2001 r.; art. 266 § 1 KK).", "P": "Samą dokumentację medyczną udostępnia się prokuraturze (art. 26 ust. 3 pkt 3 ustawy o prawach pacjenta), ale o wypowiedziach Kuby co do czynu zeznawać nie wolno (art. 52 ust. 1 u.o.z.p.).", "K": "Wszystko, co mówił Kuba, jest w aktach — twoimi słowami."}, "C": {"S": "Zniszczenie dokumentu, którym nie masz prawa wyłącznie rozporządzać: do 2 lat (art. 276 KK).", "G": "Zniszczenie dokumentu, którym nie masz prawa wyłącznie rozporządzać: do 2 lat (art. 276 KK).", "P": "Zniszczenie dokumentu, którym nie masz prawa wyłącznie rozporządzać: do 2 lat (art. 276 KK).", "K": "Sprawa otwarta. Kodeks PTP z 1991 r. zalecał komisyjne zniszczenie materiałów poufnych; kodeks z 2018 r. tego zdania nie zawiera."}, "C0": {"S": "Odpowiedź jest prawdziwa, ale brak wpisu z wtorku narusza obowiązek dokumentowania (§ 18 rozp. MEN).", "P": "Odpowiedź jest prawdziwa, ale brak wpisu z wtorku narusza obowiązek dokumentowania (§ 4 ust. 1 rozp. MZ).", "G": "Odpowiedź jest prawdziwa, a ustawa z 2001 r. nie zna obowiązku dokumentacji.", "K": "Sprawa otwarta: jedynym dowodem jesteś ty."}, "D": {"S": "Rzecz mogącą stanowić dowód „należy wydać na żądanie sądu lub prokuratora” (art. 217 § 1 KPK); dokument z tajemnicą zawodową — „w opieczętowanym opakowaniu” (art. 225 § 1 KPK). Zeznania dopiero po zwolnieniu z tajemnicy (art. 180 § 1 KPK).", "G": "Rzecz mogącą stanowić dowód „należy wydać na żądanie sądu lub prokuratora” (art. 217 § 1 KPK); dokument z tajemnicą zawodową — „w opieczętowanym opakowaniu” (art. 225 § 1 KPK). Zeznania dopiero po zwolnieniu z tajemnicy (art. 180 § 1 KPK).", "P": "Dokumenty „w opieczętowanym opakowaniu” (art. 225 § 1 KPK). O wypowiedziach Kuby co do czynu zeznawać nie wolno (art. 52 ust. 1 u.o.z.p.); o reszcie — po zwolnieniu z tajemnicy (art. 180 KPK).", "K": "O tajemnicy decyduje postanowienie, nie rozmowa w drzwiach. Koszt poza poradnią: po zwolnieniu z tajemnicy zeznajesz."}}}], "SRODA": {"dzien": "środa", "godz": "8:00", "dalej": "Czwartek, 12:15", "art": "sr", "kadr": [119, 10], "tel": [["d", "Powiadomienie:"], ["pow", "Od dziś HHCP-O jest w wykazie nowych substancji psychoaktywnych."], ["n", "Kuba o tym nie wie."]]}, "EPI": {"dzien": "wtorek", "godz": "16:40", "tytul": {"plus": "Telefon wibruje.", "minus": "Krzesło jest puste."}, "pismo": "Na biurku leży pismo.", "kuba": {"plus_sms": "Mogę przyjść?", "los": {"F1": "Przyjeżdża autobusem. Prawa jazdy już nie ma.", "F2": "Pisze ze szpitalnego korytarza. Bartek leży dwa piętra wyżej.", "F3": "Przychodzi punktualnie. Pierwszy raz."}, "uprzedzony": "— Jestem wściekły. Ale wiedziałem, że tak zrobisz.", "minus": "Mama Kuby odwołała wszystkie terminy. Twoje wiadomości zostają bez odpowiedzi.", "zarzut": "Zarzut za czwartek: sprzedaż małoletniemu nowej substancji psychoaktywnej. Od 3 do 20 lat; w wypadku mniejszej wagi — do 2.", "wypadek": "Za wypadek: nie mniej niż 3 lata.", "art72": {"plus": "Jeśli Kuba zostanie w leczeniu, a czyn zostanie zakwalifikowany jako wypadek mniejszej wagi, prokurator może zawiesić postępowanie (art. 72 u.p.n.).", "minus": "Art. 72 u.p.n. pozwala zawiesić postępowanie wobec osoby, która podda się leczeniu. Kuba nie jest już w leczeniu."}}, "rodzina": {"A": "Mama do dziś nie wie, co było w pudełku.", "B": "Na 16:00 byliście umówieni we troje. Nikt nie przyszedł.", "C": "W domu Kuby od czwartku nikt nie rozmawia przy kolacji.", "D": "Szafka w sypialni ma kłódkę. Nikt nie powiedział Kubie dlaczego."}, "ty": {"C": "Wezwanie w charakterze podejrzanego: zniszczenie dokumentu (art. 276 KK).", "B": "Pełnomocnik rodziny składa wniosek o ściganie: ujawnienie tajemnicy bez zwolnienia (art. 266 § 1 KK).", "A": "Postanowienie: kara porządkowa 3000 zł.", "wszystko": "Skarga: w dokumentacji leczenia utrwalono przyznanie się do czynu (art. 51 u.o.z.p.).", "nic": "Kontrola dokumentacji: brak wpisu z wtorku.", "brak": "Na biurku nie ma żadnego pisma."}, "zbiory": ["zgodne z prawem", "dobre dla Kuby"], "kropki": ["wt. 16:40", "wt. 19:10", "czw.", "pt.", "pon."], "jeszcze": "Zagraj jeszcze raz — w innym miejscu pracy"}};

function hud(dzien,godz,nr,teraz){
  let p='';for(let i=1;i<=5;i++)p+=`<u class="${i<nr||(i===nr&&!teraz)?'byla':(i===nr?'teraz':'')}"></u>`;

function linie(a){return a.map(l=>{const k=l[0];

function fakty(d){const p=d.pomoc,o=st.o[d.id]?1:0;
  const nagl=p.tytul==='Zanim odpowiesz'?'':`<h3 class="pyt">${p.tytul}</h3>`;
  const s=nagl+p.fakty.map(f=>`<h3>${f[0]}</h3><p>${f[1]}</p>${f[2]?`<cite>${f[2]}</cite>`:''}`).join('')+(p.pasek?`<div class="pasek ${p.pasek[1]}">${p.pasek[0]}</div>`:'');
  return `<div class="fakty" data-o="${o}"><button type="button" id="f-${d.id}" aria-expanded="${o?'true':'false'}" data-akcja="fakty" data-id="${d.id}"><span>Zanim odpowiesz: dwa fakty</span><img src="${Z.chev_ink}" alt=""></button>${o?`<div class="srodek">${s}</div>`:''}</div>`}
function tekstOpcji(d,o){return (d.id==='d5'&&o.k==='C'&&st.not==='nic')?o.t0:o.t}
function opcje(d){return `<div class="wybor">`+d.opcje.map(o=>`<button type="button" id="o-${d.id}-${o.k}" data-akcja="wybor" data-id="${d.id}" data-k="${o.k}"><b>${o.k}</b><span>${tekstOpcji(d,o)}${o.n?` <i>${o.n}</i>`:''}</span></button>`).join('')+`</div>`}
function odnowa(){return `<button type="button" class="odnowa" id="odnowa" data-akcja="odnowa">${st.o.reset?'Na pewno? Stuknij jeszcze raz':'Zacznij od nowa'}</button>`}
function dalej(etykieta){return `<div class="dalej"><p>Na zajęciach: odłóż telefon, omówienie jest na dużym ekranie.</p><button type="button" id="dalej" data-akcja="dalej"><span>${etykieta}</span><img src="${Z.arrow_amber}" alt=""></button></div>`}
const ALT={d1_A:'Gabinet o zmierzchu. Kuba siedzi na krześle ze spuszczoną głową. Za szybą drzwi stoi jego mama.',d1_B:'Kuba patrzy na ciebie. Za szybą drzwi stoi jego mama.',d1_C:'Kuba patrzy na ciebie zmrużonymi oczami.',d1_D:'Kuba patrzy na ciebie z zaciśniętą szczęką.',
 d2:'Gabinet wieczorem. Puste krzesło. Na biurku świeci ekran laptopa z pustym polem notatki.',sr:'Gabinet rano. Puste krzesło.',d3:'Gabinet w południe. Na biurku dzwoni telefon.',
 d4:'Noc, deszcz, osiedle bloków. Kuba w kapturze stoi przy aucie z włączonymi światłami. Po drugiej stronie auta stoi Bartek.',
 d5:'Gabinet rano. W otwartych drzwiach stoi policjant z pismem w ręce.',d5_S:'Gabinet rano. W otwartych drzwiach stoi policjant z pismem w ręce. Za nim dyrektor szkoły.',
 ep_sms:'Gabinet o zmierzchu. Puste krzesło. Na biurku świeci ekran telefonu.',ep_sms_pismo:'Gabinet o zmierzchu. Puste krzesło. Na biurku świeci ekran telefonu i leży pismo z pieczęcią.',
 ep_pusto:'Gabinet o zmierzchu. Krzesło jest puste.',ep_pusto_pismo:'Gabinet o zmierzchu. Krzesło jest puste. Na biurku leży pismo z pieczęcią.'};

/* ---------- ekrany ---------- */
function eStart(){return `<div class="tytul"><h1>Nikomu<br>nie mów</h1><p>Gra do prezentacji. Pięć decyzji psychologa, jeden tydzień.</p></div>`+kadr('d1_A',ALT.d1_A)+
  `<div class="tresc"><div class="bezkto"></div>${T.START.map((t,i)=>`<p class="${i<2?'d':'m'}">${t}</p>`).join('')}
  <div class="wybor miejsca" style="margin-top:12px">${['S','P','G'].map(m=>`<button type="button" id="m-${m}" data-akcja="miejsce" data-m="${m}"><b></b><span>${T.MIEJSCA[m][1]}</span></button>`).join('')}</div></div>`}
function artSceny(d){return (d.id==='d5'&&st.m==='S')?'d5_S':d.art}
function eScena(d){const dod=(d.scena_S&&st.m==='S')?[d.scena_S]:[];
  return hud(d.dzien,d.godz,d.nr,true)+kadr(artSceny(d),ALT[artSceny(d)])+`<div class="tresc">${tag(d)}${linie(d.scena.concat(dod))}
  <button type="button" class="glowny" id="akcja" data-akcja="dalej"><span>${d.akcja}</span><img src="${Z.arrow_ink}" alt=""></button>${odnowa()}</div>`}
function eDecyzja(d){const a=(d.id==='d5'&&st.m==='S')?'d5_S':d.art_dec;
  const gora=d.split?((d.kto?`<span class="kto ${d.tag[1]}">${d.kto}</span>`:'<div class="bezkto"></div>')+linie(d.prompt)):(tag(d)+linie(d.scena));
  return hud(d.dzien,d.godz,d.nr,true)+kadr(a,ALT[a])+`<div class="tresc">${gora}${fakty(d)}${opcje(d)}${odnowa()}</div>`}
function wariant(d,k){ // tekst skutku zależny od miejsca i notatki
  if(d.id!=='d5')return d.skutek[k];
  const P=st.m==='P',nic=st.not==='nic';
  if(k==='A')return d.skutek[P?'A_P':'A_SG'];
  if(k==='B')return nic?[['n','Dokumentacji nie ma: nie ma czego wydać. W środę zeznajesz czterdzieści minut. Wszystko, co mówił Kuba, jest teraz w aktach — twoimi słowami.']]:d.skutek.B;
  if(k==='C')return d.skutek.C; if(k==='C0')return d.skutek.C0;
  if(nic)return [['n',P?'Odpisujesz: dokumentacji nie ma. W środę odpowiadasz na pytania o przebieg leczenia. Na pytanie, co Kuba mówił o sprzedaży, powołujesz artykuł 52. Prokurator przechodzi do następnego pytania.':'Odpisujesz: dokumentacji nie ma. Dwa dni później przychodzi postanowienie: prokurator zwalnia cię z tajemnicy. W środę zeznajesz. Kuba przeczyta to w aktach.']];
  return d.skutek[P?'D_P':'D_SG']}
function eSkutek(d){const k=st.w[d.id],kk=k==='C0'?'C':k,o=d.opcje.find(x=>x.k===kk);
  const a=(d.id==='d5'&&st.m==='S')?'d5_S':d.art_sk[kk];
  let s=hud(d.dzien,d.godz,d.nr,false)+kadr(a,ALT[a])+`<div class="tresc"><span class="kto ty">Ty</span><p class="echo">${tekstOpcji(d,o)}${o.n?' '+o.n:''}</p>`;
  s+=(d.kto&&d.id!=='d4'?`<span class="kto luz ${d.tag[1]}">${d.kto}</span>`:'<div class="bezkto"></div>')+linie(wariant(d,k));
  if(d.id==='d4'){const L=d.los[st.f];s+=`<div class="czas">${L.kiedy}</div>`+(L[k]?`<p class="d">${L[k]}</p>`:'');
    s+=L.sms?`<span class="kto luz bordo">${L.kto}</span><div class="sms">${L.sms}</div>`:`<div class="dzwoni"><i></i><span>${L.kto}</span></div><p class="n">${L.tekst}</p>`}
  if(d.id==='d5'&&k!=='C'&&k!=='C0'&&st.not!=='nic')s+=`<p class="d" style="margin-top:9px">${d.notatka[NOTK[st.not]]}</p>`;
  return s+dalej(d.dalej)+odnowa()+`</div>`}
function eSroda(){const s=T.SRODA;return hud(s.dzien,s.godz,2,false)+kadr('sr',ALT.sr)+`<div class="tresc"><div class="bezkto"></div>${linie(s.tel)}
  <div class="dalej" style="border:0;padding-top:0"><button type="button" id="dalej" data-akcja="dalej"><span>${s.dalej}</span><img src="${Z.arrow_amber}" alt=""></button></div>${odnowa()}</div>`}
function ocena(d,k){const o=d.oceny[k];return {L:d.kol==='miejsca'?o[st.m]:o.L,K:o.K}}
function podstawa(d,k){const p=d.podstawy[k];return {L:d.kol==='miejsca'?p[st.m]:(p['L'+st.m]||p.L),K:p.K}}
const SLOTY={ // położenie kropek w układzie 130 x 84
 'ok,ok':[[65,40],[65,28],[65,52],[60,34],[70,46]],'ok,no':[[33,40],[33,26],[33,54],[23,40],[42,30]],'no,ok':[[97,40],[97,26],[97,54],[107,40],[88,30]],
 'no,no':[[65,78],[50,78],[80,78],[35,78],[95,78]],'ok,q':[[54,40],[57,27],[57,53],[63,19],[63,61]],'q,ok':[[76,40],[73,27],[73,53],[67,19],[67,61]],
 'q,no':[[16,40],[19,27],[19,53],[25,19],[25,61]],'no,q':[[114,40],[111,27],[111,53],[105,19],[105,61]],'q,q':[[65,17],[65,63],[59,13],[71,13],[59,67]]};
const SLOWO={ok:'tak',no:'nie',q:'sprawa otwarta'};
function eEpilog(){const E=T.EPI,plus=st.z>=0,w=st.w,art='ep_'+(plus?'sms':'pusto')+(st.pismo?'_pismo':'');
  let s=hud(E.dzien,E.godz,5,false)+kadr(art,ALT[art])+`<div class="tresc ep"><h1>${plus?E.tytul.plus:E.tytul.minus}${st.pismo?' '+E.pismo:''}</h1>`;
  s+=`<h2>Kuba</h2>`;
  if(plus){s+=`<div class="sms" style="margin-top:9px">${E.kuba.plus_sms}</div><p class="n">${E.kuba.los[st.f]}</p>`;
    if(st.up&&(w.d4==='A'||w.d4==='D'))s+=`<p class="m">${E.kuba.uprzedzony}</p>`}
  else s+=`<p class="n">${E.kuba.minus}</p>`;
  s+=`<p class="n">${E.kuba.zarzut}</p>`+(st.f==='F2'?`<p class="n">${E.kuba.wypadek}</p>`:'')+`<p class="d">${E.kuba.art72[plus?'plus':'minus']}</p>`;
  s+=`<h2>Rodzina</h2><p class="n">${E.rodzina[st.mama]}</p>`;
  let ty=E.ty.brak;
  if(w.d5==='C')ty=E.ty.C;else if(w.d5==='B')ty=E.ty.B;else if(w.d5==='A'&&st.m!=='P')ty=E.ty.A;
  else if(st.not==='wszystko'&&st.m==='P')ty=E.ty.wszystko;else if(st.not==='nic'&&st.m!=='G')ty=E.ty.nic;
  s+=`<h2>Ty</h2><p class="n">${ty}</p>`;
  // diagram: pięć kropek
  const licz={},wier=[];let kropki='';
  T.D.forEach((d,i)=>{const k=w[d.id],oc=ocena(d,k),kl=oc.L+','+oc.K;licz[kl]=(licz[kl]||0);const p=SLOTY[kl][licz[kl]++];
    const q=(oc.L==='q'||oc.K==='q');const otw=st.o.kropka===d.id;
    kropki+=`<button type="button" class="${q?'q':''}" id="k-${d.id}" style="left:${p[0]/130*100}%;top:${p[1]/84*100}%" data-akcja="kropka" data-id="${d.id}" aria-pressed="${otw}" aria-label="Decyzja ${i+1}: ${E.kropki[i]}">${i+1}</button>`;
    const kk=k==='C0'?'C':k,o=d.opcje.find(x=>x.k===kk),pd=podstawa(d,k);
    wier.push(`<div class="wiersz" data-o="${otw?1:0}"><button type="button" id="w-${d.id}" data-akcja="kropka" data-id="${d.id}" aria-expanded="${otw}"><b>${i+1}</b><span><small>${E.kropki[i]}</small>${k==='C0'?'Brak dokumentacji':o.kr}</span><img src="${Z['mark_'+oc.L]}" alt="Prawo: ${SLOWO[oc.L]}"><img src="${Z['mark_'+oc.K]}" alt="Dobre dla Kuby: ${SLOWO[oc.K]}"></button>`+
      (otw?`<div class="wiecej"><h4 class="l">Prawo${d.kol==='miejsca'?' ('+T.MIEJSCA[st.m][0]+')':''}: ${SLOWO[oc.L]}</h4><p>${pd.L}</p><h4 class="k">Dobre dla Kuby: ${SLOWO[oc.K]}</h4><p>${pd.K}</p></div>`:'')+`</div>`)});
  s+=`<h2>Twoje pięć decyzji</h2><div class="zb"><img src="${Z.zbiory}" alt="Dwa zbiory: lewy to decyzje zgodne z prawem, prawy to decyzje dobre dla Kuby. Kropki pokazują twoje pięć decyzji.">${kropki}</div>
   <div class="podpisy"><span>${E.zbiory[0]}</span><span>${E.zbiory[1]}</span></div><p class="d" style="margin-bottom:9px">Stuknij kropkę albo wiersz: zobaczysz ocenę i przepis.</p><div class="lista">${wier.join('')}</div>
   <div class="legenda"><span><img src="${Z.mark_ok}" alt="">tak</span><span><img src="${Z.mark_no}" alt="">nie</span><span><img src="${Z.mark_q}" alt="">sprawa otwarta</span><span>pierwszy znak: prawo, drugi: dobre dla Kuby</span></div>
   <button type="button" class="glowny" id="jeszcze" data-akcja="jeszcze"><span>${E.jeszcze}</span><img src="${Z.arrow_ink}" alt=""></button>
   <p class="zakres">${T.ZAKRES}</p></div>`;
  return s}

/* ---------- reguły ---------- */
function wybierz(id,k){const m=st.m;
  if(id==='d1'){if(k==='A'){st.z+=1;st.ob=true}else if(k==='C'){st.z+=1;st.up=true}else if(k==='D')st.z-=1}
  if(id==='d2'){st.not=NOT[k];if((k==='A'&&m!=='G')||(k==='B'&&m==='P'))st.pismo=true}
  if(id==='d3'){st.z+={A:1,B:1,C:-2,D:-1}[k];st.mama=k}
  if(id==='d4'){if(k==='A')st.z+=st.up?-1:(st.ob?-3:-2);else if(k==='B')st.z+=1;else if(k==='D')st.z+=st.up?0:(st.ob?-2:-1);
    st.f=(window.__los||['F1','F2','F3'][Math.floor(Math.random()*3)])}
  if(id==='d5'){if(k==='C'&&st.not==='nic')k='C0';
    if(k==='A')st.z+=1;else if(k==='B')st.z-=2;else if(k==='D')st.z+=(m==='P'?0:-1);
    if(k==='B'||k==='C'||(k==='A'&&m!=='P'))st.pismo=true}
  st.w[id]=k}
function rysuj(fokus){const e=st.e;let h;
  if(e==='start')h=eStart();else if(e==='sr')h=eSroda();else if(e==='ep')h=eEpilog();
  else{const d=D[e.slice(0,2)],t=e[2];h=t==='s'?eScena(d):(t==='d'?eDecyzja(d):eSkutek(d))}
  gra.innerHTML=h;gra.classList.remove('wej');void gra.offsetWidth;gra.classList.add('wej');
  if(fokus){const el=document.getElementById(fokus);if(el)el.focus({preventScroll:true})}else window.scrollTo(0,0)}
function idz(){let i=KOL.indexOf(st.e)+1;st.e=KOL[i];st.o={};zapisz();rysuj()}
gra.addEventListener('click',ev=>{const b=ev.target.closest('button[data-akcja]');if(!b)return;const a=b.dataset.akcja;
  if(a!=='odnowa'&&st.o.reset){st.o.reset=false}
  if(a==='miejsce'){st=nowy();st.m=b.dataset.m;idz()}
  else if(a==='dalej')idz();
  else if(a==='wybor'){wybierz(b.dataset.id,b.dataset.k);idz()}
  else if(a==='fakty'){st.o[b.dataset.id]=!st.o[b.dataset.id];rysuj(b.id)}
  else if(a==='kropka'){st.o.kropka=st.o.kropka===b.dataset.id?null:b.dataset.id;rysuj('w-'+b.dataset.id);const el=document.getElementById('w-'+b.dataset.id);if(el&&b.id.startsWith('k-'))el.scrollIntoView({block:'nearest'})}
  else if(a==='jeszcze'){st=nowy();zapisz();rysuj()}
  else if(a==='odnowa'){if(st.o.reset){st=nowy();zapisz();rysuj()}else{st.o.reset=true;rysuj('odnowa')}}});
window.__stan=()=>st;
try{window.claude?.hot?.snapshot?.(()=>st)}catch(e){}
function start(d){if(d&&d.e&&KOL.includes(d.e))st=d;else{const s=wczytaj();if(s)st=s}if(!st.o)st.o={};rysuj()}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
</body></html>
