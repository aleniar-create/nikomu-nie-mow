<style>
/* Układ: jedna kolumna jak ekran gry — u góry pasek dnia, pod nim kadr sceny (piksel grafiki = 3 px), niżej tekst i wybory. */
:root{
  color-scheme:dark;
  --tlo:#07080b; --sadza:#0e1014; --noc:#14171f; --grafit:#232937; --stal:#3b4658; --mgla:#9aa5b3;

  --prawo:#8fb4d3; --kuba:#e8b25a; --pieczec:#b4443c; --pieczec-j:#e56b5c; --ok:#74c48f; --bordo:#5e2c37; --szyba:#4a605f; --mundur:#263247;

  --bok-l:max(16px,env(safe-area-inset-left,0px)); --bok-p:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--papier);font-family:var(--gra);-webkit-text-size-adjust:100%}
img{image-rendering:pixelated;display:block}
.nb{white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--papier);outline-offset:2px}
#gra{max-width:430px;min-height:100%;margin:0 auto;background:var(--sadza);display:flex;flex-direction:column;position:relative;overflow:hidden}
.hud{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:9px;padding-block:9px;padding-left:var(--bok-l);padding-right:var(--bok-p);background:var(--tlo)}
.data{display:flex;font-size:28px;line-height:30px;white-space:nowrap}
.data b{background:var(--pieczec);color:var(--papier);padding:0 9px;font-weight:400}
.data i{background:var(--papier);color:var(--tusz);padding:0 9px;font-style:normal}
.stan{display:flex;align-items:center;gap:6px;font-size:23px;line-height:24px;color:var(--mgla)}
.stan span{margin-right:6px}
.stan u{display:block;width:12px;height:12px;border:3px solid var(--papier-3)}
.stan u.teraz{background:var(--kuba);border-color:var(--kuba)}
.stan u.byla{background:var(--papier-3)}
.kadr{height:216px;flex:none;overflow:hidden;position:relative;border-bottom:3px solid var(--stal);background:var(--noc)}
.kadr img{position:absolute;width:960px;max-width:none;height:360px}
.kadr i{position:absolute;display:block;background-repeat:no-repeat;image-rendering:crisp-edges;image-rendering:pixelated;animation:ruch 2.88s steps(24) infinite}
@keyframes ruch{to{background-position:0 var(--koniec)}}
.tresc{flex:1;display:flex;flex-direction:column;padding-block:0 21px;padding-left:var(--bok-l);padding-right:var(--bok-p)}
.kto{align-self:flex-start;margin:-18px 0 9px;position:relative;font-size:23px;line-height:30px;padding:0 12px;background:var(--bordo);color:var(--papier)}
.kto.ty{background:var(--kuba);color:var(--tusz)} .kto.szyba{background:var(--szyba)} .kto.mundur{background:var(--mundur)}
.kto.luz{margin-top:15px} .kto+.kto{margin-top:0}
.bezkto{height:15px}
p{margin:0}
p.m{font-size:28px;line-height:32px;margin:3px 0}
p.d{font-size:23px;line-height:27px;color:var(--mgla);margin:3px 0}
p.n{font-size:25px;line-height:30px;margin:4px 0}
p.dm{font-size:28px;line-height:32px;margin:3px 0} p.dm span{color:var(--mgla);font-size:23px}
p.echo{font-size:23px;line-height:27px;color:var(--kuba)}
p.pyt{font-size:37.333px;line-height:39px;margin:18px 0 6px;color:var(--kuba)}
.sms{align-self:flex-start;max-width:92%;background:var(--grafit);border:3px solid var(--stal);padding:9px 12px 6px;font-size:25px;line-height:29px;margin:3px 0 6px;position:relative}
.sms::after{content:"";position:absolute;left:-3px;bottom:-12px;width:12px;height:9px;background:var(--stal);clip-path:polygon(0 0,100% 0,0 100%)}
.pow{background:var(--papier);color:var(--tusz);padding:9px 12px;margin:6px 0 9px;font-size:23px;line-height:27px;box-shadow:6px 6px 0 rgba(0,0,0,.5)}
.pow b{display:block;font-weight:400;color:var(--pieczec);font-size:20px;line-height:22px}
.czas{align-self:flex-start;margin:18px 0 9px;font-size:23px;line-height:27px;background:var(--papier);color:var(--tusz);padding:0 9px}

/* kartka z dwoma faktami */
.fakty{margin:15px 0 12px;background:var(--papier);color:var(--tusz);box-shadow:inset -3px -3px 0 var(--papier-2),6px 6px 0 rgba(0,0,0,.5)}

.wybor{display:flex;flex-direction:column;gap:9px;margin-top:3px}

.wybor span{padding:9px 12px 6px;align-self:center}

.wybor.miejsca img{height:21px;flex:none;margin-right:15px}

.dalej button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--noc);color:var(--kuba);border:3px solid var(--kuba);font-size:28px;line-height:30px;padding:9px 15px}
.odnowa{margin-top:auto;padding-top:27px;align-self:center;background:none;border:0;color:var(--stal);font-size:20px;line-height:24px;text-decoration:underline}
/* start */
.tytul{padding-block:21px 15px;padding-left:var(--bok-l);padding-right:var(--bok-p);background:var(--tlo)}
.tytul h1{margin:0;font-weight:400;font-size:74.667px;line-height:66px;letter-spacing:0}
.tytul p{font-size:21px;line-height:24px;color:var(--mgla);margin-top:9px}
.tytul p.stat{margin-top:6px}

.ep p.wstep{font-size:23px;line-height:27px;color:var(--mgla);margin-top:15px}
.ep h1{font-weight:400;font-size:37.333px;line-height:39px;margin:6px 0 6px}
.ep h2{font-weight:400;font-size:23px;line-height:27px;margin:21px 0 3px;align-self:flex-start;padding:0 9px;background:var(--grafit);color:var(--papier)}
.ep p.n{font-size:23px;line-height:28px}
.licz{display:flex;flex-direction:column;gap:3px;margin:9px 0 12px}
.licz p{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:25px;line-height:30px;border-bottom:3px solid var(--grafit);padding-bottom:3px}
.licz p b{font-weight:400;font-size:28px;white-space:nowrap}
.licz p.l{color:var(--prawo)} .licz p.k{color:var(--kuba)} .licz p.o{color:var(--papier)}
.glowka{display:flex;justify-content:flex-end;gap:9px;padding:0 12px 3px;font-size:19px;line-height:21px}
.glowka span{flex:none;width:42px;text-align:center}
.glowka span:first-child{color:var(--prawo)} .glowka span:last-child{color:var(--kuba)}
.lista{display:flex;flex-direction:column;gap:9px}
.wiersz{background:var(--noc);border:3px solid var(--stal)}
.wiersz[data-o="1"]{border-color:var(--kuba)}
.wiersz>button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;padding:6px 9px;text-align:left;font-size:21px;line-height:24px}
.wiersz>button b{flex:none;width:27px;height:27px;background:var(--papier);color:var(--tusz);font-weight:400;font-size:23px;line-height:27px;text-align:center}
.wiersz>button span{flex:1;min-width:0}
.wiersz>button span small{display:block;font-size:19px;line-height:21px;color:var(--mgla)}

.legenda{display:flex;flex-wrap:wrap;gap:6px 15px;font-size:19px;line-height:22px;color:var(--mgla);margin-top:12px}

@keyframes wej{from{opacity:.65}to{opacity:1}}

 Kubie?", "zanim": "Zanim odpowiesz Kubie", "fakty": [["Tajemnica zawodowa ma dwa wyjątki.", "Psycholog musi dochować tajemnicy. Nie dotyczy to dwóch sytuacji: gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób” albo gdy „tak stanowią ustawy”.", "art. 14 ustawy o zawodzie psychologa z 2001 r."], ["Kuba ma 17 lat.", "Przed sądem karnym odpowiada już jak dorosły (art. 10 § 1 Kodeksu karnego). U psychologa jest jeszcze niepełnoletni: prawnie reprezentują go rodzice (art. 98 § 1 Kodeksu rodzinnego i opiekuńczego).", ""]], "pasek": ["Za złamanie tajemnicy: do 2 lat pozbawienia wolności (art. 266 § 1 Kodeksu karnego).", "kara"]}, "opcje": [{"k": "A", "t": "„Obiecuję. To zostaje między nami.”", "kr": "„Obiecuję”"}, {"k": "B", "t": "„A czego się boisz, jeśli ktoś się dowie?”", "kr": "„Czego się boisz?”"}, {"k": "C", "t": "„To zostaje między nami, poza kilkoma wyjątkami.”", "n": "Mówisz, jakie to wyjątki.", "kr": "„Poza wyjątkami”"}, {"k": "D", "t": "„Tego nie mogę obiecać. Poprośmy mamę i porozmawiajmy we troje.”", "kr": "„Poprośmy mamę”"}], "skutek": {"A": [["d", "Kuba oddycha z ulgą."], ["m", "— Dobra."], ["d", "Opowiada dalej: komu sprzedaje, za ile, gdzie trzyma wkłady. Wiesz coraz więcej. A słowo „obiecuję” już padło."]], "B": [["d", "Kuba wzrusza ramionami."], ["m", "— Że tata się wścieknie. Że wywalą mnie ze szkoły."], ["d", "O tajemnicę już nie pyta. Uznał, że skoro nie było odmowy, to znaczy „tak”."]], "C": [["d", "Kuba mruży oczy."], ["m", "— Czyli jak pojadę w piątek, to dzwonisz?"], ["d", "Nie wychodzi. Ale od tej chwili uważa na każde słowo."]], "D": [["d", "Kuba zaciska szczękę."], ["m", "— Nie. Jak ją zawołasz, wychodzę."], ["d", "Mama zostaje za drzwiami. Kuba też zostaje, ale prawie się już nie odzywa."]]}, "art_sk": {"A": "d1_B", "B": "d1_B", "C": "d1_C", "D": "d1_D"}, "kol": "prawo", "oceny": {"A": {"L": "ok", "K": "no"}, "B": {"L": "ok", "K": "no"}, "C": {"L": "ok", "K": "ok"}, "D": {"L": "q", "K": "q"}}, "podstawy": {"A": {"L": "Żaden przepis nie zakazuje złożenia takiej obietnicy.", "LS": "Żaden przepis nie zakazuje złożenia takiej obietnicy. W szkole rodziców informuje się jednak o tym, że uczeń potrzebuje pomocy (§ 23 ust. 1 rozporządzenia MEN o pomocy psychologiczno-pedagogicznej).", "K": "Tej obietnicy nie da się dotrzymać: tajemnica ma ustawowe wyjątki (art. 14 ust. 3 ustawy o zawodzie psychologa z 2001 r.). Kodeks Etyczny Psychologa wymaga, żeby klient znał „zakres tajemnicy zawodowej” (punkt 10.2.b)."}, "B": {"L": "Takie pytanie nie narusza żadnego przepisu.", "K": "Kuba nadal nie wie, jakie są granice tajemnicy (Kodeks Etyczny Psychologa, punkt 10.2.b). Brak odmowy uznał za zgodę."}, "C": {"L": "Zgodne z art. 14 ustawy o zawodzie psychologa z 2001 r.: tajemnica obowiązuje, poza wyjątkami z ustępu 3.", "K": "Kodeks Etyczny Psychologa, punkt 10.2.b: klient dostaje informację „odnośnie […] zakresu tajemnicy zawodowej”. Najlepszy moment na tę rozmowę był na pierwszym spotkaniu."}, "D": {"L": "Czy rodzicom siedemnastolatka wolno powiedzieć, co mówi u psychologa: prawnicy się spierają (Kmieciak 2026; opinia prawna Polskiego Towarzystwa Psychologicznego 2017).", "K": "Ta sama wątpliwość. Do sprawy rodziców wracamy w czwartek."}}}, {"id": "d2", "nr": 2, "dzien": "wtorek", "godz": "19:10", "dalej": "środa, 8:00", "nazwa": "Notatka", "tag": null, "opis": "", "kto": null, "scena": [["n", "Kuba wyszedł godzinę temu."], ["n", "Otwierasz jego dokumentację. Pole na dzisiejszą notatkę jest puste."], ["n", "Co wpiszesz?"]], "akcja": "Wybierz, co wpiszesz", "prompt": [["n", "Co wpiszesz do dokumentacji Kuby?"]], "art": "d2", "art_dec": "d2", "pomoc": {"tytul": "Co wpiszesz do dokumentacji?", "zanim": "Zanim coś wpiszesz", "fakty": [["Notatkę mogą kiedyś przeczytać rodzice Kuby.", "W poradni dokumentację udostępnia się „pacjentowi lub jego przedstawicielowi ustawowemu”, czyli także rodzicom (art. 26 ust. 1 ustawy o prawach pacjenta). W szkole rodzice mają wgląd do dziennika elektronicznego „w zakresie dotyczącym ich dzieci” (§ 21 ust. 3 pkt 5 rozporządzenia MEN o dokumentacji).", ""], ["Może ją przeczytać sąd albo prokurator.", "Rzecz, która może być dowodem, „należy wydać na żądanie sądu lub prokuratora” (art. 217 § 1 Kodeksu postępowania karnego). Dokument z tajemnicą zawodową trafia do nich „w opieczętowanym opakowaniu” (art. 225 § 1).", ""]], "pasek": null}, "opcje": [{"k": "A", "t": "Tylko to, że pali i jak często. O sprzedaży, o marihuanie taty i o piątkowej jeździe nie piszę.", "kr": "Tylko to, że pali", "czyn": true}, {"k": "B", "t": "Wszystko, słowami Kuby. Także to, że sprzedaje wkłady i podbiera tacie marihuanę.", "kr": "Wszystko, słowami Kuby", "czyn": true}, {"k": "C", "t": "Do dokumentacji jedno zdanie: „odbyło się spotkanie”. Resztę zapisuję w prywatnym zeszycie.", "kr": "Jedno zdanie + prywatny zeszyt", "czyn": true}, {"k": "D", "t": "Jak często pali, plan jazdy, moje ostrzeżenia. Bez jego słów o sprzedaży i o marihuanie taty.", "kr": "To, co ważne dla terapii", "czyn": true}], "skutek": {"A": [["n", "Jedno zdanie: „Pali marihuanę codziennie, od pół roku.” Zapisujesz. O piątku nie ma w notatce ani słowa."]], "B": [["n", "Trzy akapity. Słowa Kuby w cudzysłowach. Zapisujesz. Plik ma teraz datę, godzinę i twoje nazwisko."]], "C": [["n", "W systemie jest jedno zdanie. W szufladzie leży zeszyt: dwie strony drobnym pismem. Zamykasz szufladę na klucz."]], "D": [["n", "Pięć zdań: jak często pali, co planuje na piątek, przed czym go ostrzegasz. Słowa „sprzedaję” w notatce nie ma."]]}, "art_sk": {"A": "d2", "B": "d2", "C": "d2", "D": "d2"}, "kol": "miejsca", "oceny": {"A": {"S": "ok", "P": "ok", "G": "ok", "K": "q"}, "B": {"S": "q", "P": "no", "G": "ok", "K": "no"}, "C": {"S": "q", "P": "q", "G": "ok", "K": "q"}, "D": {"S": "ok", "P": "ok", "G": "ok", "K": "ok"}}, "podstawy": {"A": {"S": "Wpis o tym, co się odbyło, jest (§ 18 rozporządzenia MEN o dokumentacji). Treści rozmowy przepis nie wymaga.", "P": "Wpis jest (§ 4 ust. 1 rozporządzenia Ministra Zdrowia o dokumentacji medycznej), a przyznania się do czynu zabronionego w nim nie ma (art. 51 ustawy o ochronie zdrowia psychicznego).", "G": "Żaden przepis tego nie zakazuje.", "K": "Nie ma jednej odpowiedzi. W notatce nie ma słów Kuby o sprzedaży ani o marihuanie taty. Nie ma też planu jazdy po paleniu ani twoich ostrzeżeń, a psycholog „w sposób odpowiedzialny i rzetelny zarządza informacjami” (Kodeks Etyczny Psychologa, punkt 11.3.a)."}, "B": {"S": "Nie ma jednej odpowiedzi: przepis określa, co wpisuje się do dziennika psychologa (§ 18 rozporządzenia MEN o dokumentacji), a do dziennika elektronicznego mają wgląd rodzice (§ 21 ust. 3 pkt 5).", "P": "Zakazane wprost: w dokumentacji leczenia „nie utrwala się oświadczeń obejmujących przyznanie się do popełnienia czynu zabronionego” (art. 51 ustawy o ochronie zdrowia psychicznego).", "G": "Żaden przepis tego nie zakazuje.", "K": "Przyznanie się Kuby zostaje na piśmie, z datą i twoim nazwiskiem. Tę notatkę mogą kiedyś przeczytać rodzice, sąd i prokurator."}, "C": {"S": "Nie wiadomo, czy prywatny zeszyt jest „dokumentacją”: przepisy tego nie rozstrzygają.", "P": "Nie wiadomo, czy prywatny zeszyt jest „dokumentacją”: przepisy tego nie rozstrzygają.", "G": "Dziś wolno. Od 19 maja 2028 klient nie będzie miał dostępu do notatek roboczych psychologa (art. 28 ust. 4 nowej ustawy), ale będą one należeć do „wszystkich materiałów” tworzących dokumentację (art. 2 pkt 1).", "K": "Nie ma jednej odpowiedzi: zeszyt z szuflady też jest rzeczą, którą trzeba wydać na żądanie sądu lub prokuratora (art. 217 § 1 Kodeksu postępowania karnego)."}, "D": {"S": "Wpis o tym, co się odbyło, jest (§ 18 rozporządzenia MEN o dokumentacji). Treści rozmowy przepis nie wymaga.", "P": "Wpis jest (§ 4 ust. 1 rozporządzenia Ministra Zdrowia o dokumentacji medycznej), a przyznania się do czynu zabronionego w nim nie ma (art. 51 ustawy o ochronie zdrowia psychicznego).", "G": "Żaden przepis tego nie zakazuje.", "K": "Kodeks Etyczny Psychologa, punkt 11.3.a: rzetelne zarządzanie informacjami. Cena: plan jazdy po paleniu jest w dokumentacji."}}}, {"id": "d3", "nr": 3, "dzien": "czwartek", "godz": "12:15", "dalej": "piątek, 21:40", "nazwa": "Telefon mamy", "tag": ["Mama Kuby", "szyba"], "opis": "Dzwoni do ciebie.", "kto": "Mama Kuby", "scena": [["m", "— Znalazłam w plecaku Kuby pudełko wkładów do e-papierosa."], ["m", "— Mąż ma medyczną marihuanę na receptę. Ostatnio jej ubywa."], ["m", "— Czy Kuba coś bierze? Mam zamknąć leki męża na klucz?"]], "akcja": "Odpowiedz mamie", "prompt": [["m", "— Czy Kuba coś bierze? Mam zamknąć leki męża na klucz?"]], "art": "d3", "art_dec": "d3", "pomoc": {"tytul": "Co odpowiesz mamie Kuby?", "zanim": "Zanim odpowiesz mamie Kuby", "fakty": [["Ile wolno powiedzieć rodzicom? Zależy, gdzie pracujesz.", "W poradni: rodzic ma prawo do informacji o stanie zdrowia dziecka (art. 9 ust. 2 ustawy o prawach pacjenta). W szkole: rodziców informuje się, że uczeń potrzebuje pomocy (§ 23 ust. 1 rozporządzenia MEN). W prywatnym gabinecie: ustawa o zawodzie psychologa nic o rodzicach nie mówi.", ""], ["Recepta na marihuanę jest taty, nie Kuby.", "Kiedy Kuba ją zabiera, wchodzą w grę dwa przepisy karne: posiadanie środka odurzającego (art. 62 ustawy o przeciwdziałaniu narkomanii) i jego kradzież (art. 64: od 3 miesięcy do 5 lat pozbawienia wolności).", ""]], "pasek": null}, "opcje": [{"k": "A", "t": "„O tym, co mówi mi Kuba, nie mogę rozmawiać.”", "kr": "„Nie mogę o tym rozmawiać”"}, {"k": "B", "t": "„Nie przez telefon. Proszę przyjść razem z Kubą.”", "kr": "„Nie przez telefon, razem z Kubą”"}, {"k": "C", "t": "Mówię jej wszystko, co wiem.", "kr": "Mówię mamie wszystko", "czyn": true}, {"k": "D", "t": "„Leki zawsze warto trzymać pod kluczem.”", "n": "Nic więcej nie mówisz.", "kr": "„Leki warto zamknąć”"}], "skutek": {"A": [["m", "— Rozumiem — mówi mama."], ["d", "Ale nie rozumie. Rozłącza się. Zostaje z pudełkiem wkładów w ręce. Szafki z lekami nikt nie zamknął."]], "B": [["d", "Umawiacie się na wtorek, na 16:00. Na pytanie o leki nie odpowiadasz. Do wtorku marihuana taty stoi tam, gdzie stała."]], "C": [["d", "Mama milczy, dopóki nie skończysz."], ["m", "— Dziękuję — mówi na końcu."], ["d", "Wieczorem Kuba usłyszy od niej wszystko, co jej teraz mówisz."]], "D": [["m", "— Czyli tak — mówi mama cicho."], ["d", "Niczego nie potwierdzasz. Wieczorem na szafce w sypialni wisi kłódka. Kuba ją zauważa."]]}, "art_sk": {"A": "d3", "B": "d3", "C": "d3", "D": "d3"}, "kol": "prawo", "oceny": {"A": {"L": "q", "K": "q"}, "B": {"L": "ok", "K": "ok"}, "C": {"L": "q", "K": "no"}, "D": {"L": "q", "K": "q"}}, "podstawy": {"A": {"L": "Nie ma jednej odpowiedzi. W poradni rodzic ma prawo do „przystępnej informacji o stanie zdrowia pacjenta” (art. 9 ust. 2 ustawy o prawach pacjenta). Oba stanowiska prawników dopuszczają przekazanie rodzicom co najmniej wniosków.", "K": "Nie ma jednej odpowiedzi: Kuba zachowuje zaufanie do ciebie, ale marihuana taty zostaje niezamknięta."}, "B": {"L": "Przez telefon nie da się potwierdzić, kto dzwoni. Sobczak i Straburzyński (2015): informacje przekazuje się rodzicom co do zasady w obecności dziecka.", "K": "Kuba jest przy rozmowie o sobie. Cena: do wtorku marihuana taty stoi tam, gdzie stała."}, "C": {"L": "Nie ma jednej odpowiedzi. Kmieciak (2026): prawo nie przewiduje tajemnicy przed rodzicami dziecka. Opinia prawna Polskiego Towarzystwa Psychologicznego (2017): rodzice nie mogą żądać wszystkich informacji.", "K": "Informacje przekazuje się „wyłącznie w niezbędnym zakresie” (art. 14 ust. 2b ustawy o prawach pacjenta). Kodeks Etyczny Psychologa, punkt 11.3.c: o zakresie decyduje psycholog, „kierując się przede wszystkim celem”."}, "D": {"L": "To pośrednie potwierdzenie. Czy wobec rodziców obowiązuje tajemnica: prawnicy się spierają.", "K": "Nie ma jednej odpowiedzi: marihuana taty jest zamknięta, ale Kuba widzi kłódkę i nie wie, kto co powiedział."}}}, {"id": "d4", "nr": 4, "dzien": "piątek", "godz": "21:40", "dalej": "poniedziałek, 9:05", "nazwa": "SMS od Kuby", "tag": ["SMS od Kuby", "bordo"], "opis": "", "kto": "Kuba", "scena": [["sms", "Wiem, że mama do ciebie dzwoniła. Jadę autem taty na osiemnastkę, zabieram Bartka. Zapaliłem tylko dwa buchy, luz. Nie dzwoń do niej."]], "akcja": "Zdecyduj, co robisz", "prompt": [["sms", "Wiem, że mama do ciebie dzwoniła. Jadę autem taty na osiemnastkę, zabieram Bartka. Zapaliłem tylko dwa buchy, luz. Nie dzwoń do niej."]], "art": "d4", "art_dec": "d4", "pomoc": {"tytul": "Co zrobisz po tym SMS-ie?", "zanim": "Zanim coś zrobisz", "fakty": [["Jazda „pod wpływem środka odurzającego” to przestępstwo.", "„Kto, znajdując się w stanie nietrzeźwości lub pod wpływem środka odurzającego, prowadzi pojazd mechaniczny […] podlega karze pozbawienia wolności do lat 3.”", "art. 178a § 1 Kodeksu karnego. Progu dla THC, substancji czynnej marihuany, ustawa nie podaje."], ["Gdy zagrożone jest życie, tajemnica może ustąpić.", "Tajemnicy nie stosuje się, gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób”. Ten przepis pozwala ujawnić. Nie nakazuje.", "art. 14 ust. 3 pkt 1 ustawy o zawodzie psychologa z 2001 r."]], "pasek": ["Sama jazda jest legalna: prawo jazdy wolno mieć od 17 lat, Kuba ma je od maja, a Bartek jest pełnoletni.", "info"]}, "opcje": [{"k": "A", "t": "Dzwonię pod numer alarmowy 112.", "kr": "Dzwonię pod 112", "czyn": true}, {"k": "B", "t": "Dzwonię do Kuby.", "kr": "Dzwonię do Kuby", "czyn": true}, {"k": "C", "t": "Odkładam telefon. Porozmawiamy we wtorek.", "kr": "Odkładam telefon", "czyn": true}, {"k": "D", "t": "Dzwonię do jego mamy.", "kr": "Dzwonię do mamy Kuby", "czyn": true}], "skutek": {"A": [["n", "Mówisz dyspozytorowi, kto prowadzi, skąd jedzie i że może być po marihuanie. Rozłączasz się. Drży ci ręka."]], "B": [["n", "Kuba odbiera po trzecim sygnale. Mówisz krótko: zatrzymaj się, zostaw auto, weź taksówkę."], ["m", "— Zobaczę — mówi."], ["n", "Rozłącza się."]], "C": [["n", "Ekran gaśnie. Odkładasz telefon ekranem do dołu."]], "D": [["n", "Mama odbiera od razu. Mówisz jedno zdanie: Kuba jedzie autem i nie powinien prowadzić."], ["m", "— Przecież jest u kolegi…"], ["n", "Rozłącza się, żeby do niego zadzwonić."]]}, "art_sk": {"A": "d4", "B": "d4", "C": "d4", "D": "d4"}, "los": {"F1": {"kiedy": "Sobota, 8:10", "kto": "SMS od Kuby", "sms": "Zatrzymała mnie policja, 400 metrów od domu. Test na narkotyki wyszedł dodatni. Pobrali mi krew i zabrali prawo jazdy.", "nazwa": "kontrola policji", "A": "Patrol wysłany po twoim zgłoszeniu stał na jego trasie.", "D": ""}, "F2": {"kiedy": "Sobota, 6:40", "kto": "Dzwoni mama Kuby", "tekst": "Płacze. Był wypadek na rondzie. Kuba ma złamany obojczyk. Bartek nie czuje nóg.", "nazwa": "wypadek", "A": "Patrol wysłany po twoim zgłoszeniu nie zdążył.", "D": "Mama dodzwoniła się do Kuby o 21:52. Nie zawrócił."}, "F3": {"kiedy": "Piątek, 23:10", "kto": "SMS od Kuby", "sms": "Jestem w domu. Widzisz? Nic się nie stało.", "nazwa": "spokojny powrót", "A": "Patrol wysłany po twoim zgłoszeniu go nie znalazł.", "D": "Mama dodzwoniła się do Kuby o 21:52."}}, "kol": "prawo", "oceny": {"A": {"L": "ok", "K": "q"}, "B": {"L": "ok", "K": "q"}, "C": {"L": "ok", "K": "no"}, "D": {"L": "ok", "K": "q"}}, "dopisek": "Zakończenie piątku (kontrola policji, wypadek albo spokojny powrót) było losowe. Nie wpływa na ocenę decyzji.", "podstawy": {"A": {"L": "Tajemnicy nie stosuje się, gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób” (art. 14 ust. 3 pkt 1 ustawy o zawodzie psychologa z 2001 r.). Mówisz tylko o jeździe. Czy zagrożenie jest „poważne”, ocenia psycholog.", "LP": "W poradni tajemnica ustępuje, gdy jej zachowanie „może stanowić niebezpieczeństwo dla życia lub zdrowia pacjenta lub innych osób” (art. 14 ust. 2 pkt 2 ustawy o prawach pacjenta). Mówisz tylko o jeździe: „wyłącznie w niezbędnym zakresie” (ust. 2b).", "K": "Nie ma jednej odpowiedzi: ten telefon może uratować życie, ale może też skończyć się zarzutem dla Kuby."}, "B": {"L": "Rozmowa z klientem nie narusza żadnego przepisu.", "K": "Nie ma jednej odpowiedzi: taka rozmowa może ocalić zaufanie, ale nie zatrzyma auta."}, "C": {"L": "W Polsce nie ma przepisu, który każe psychologowi kogokolwiek ostrzec. Znany wyrok Tarasoff (1976), który wprowadził taki obowiązek, dotyczy Kalifornii.", "K": "Kodeks Etyczny Psychologa, punkt 5.1: chronić dobro osoby, której się pomaga, „unikając szkody (primum non nocere)”."}, "D": {"L": "Tajemnicy nie stosuje się, gdy „poważnie jest zagrożone zdrowie, życie klienta lub innych osób” (art. 14 ust. 3 pkt 1 ustawy o zawodzie psychologa z 2001 r.). Mówisz tylko o jeździe.", "LP": "W poradni: art. 14 ust. 2 pkt 2 ustawy o prawach pacjenta. Mówisz tylko o jeździe: „wyłącznie w niezbędnym zakresie” (ust. 2b).", "K": "Nie ma jednej odpowiedzi: mama może go zatrzymać albo nie zdążyć."}}}, {"id": "d5", "nr": 5, "dzien": "poniedziałek", "godz": "9:05", "dalej": "zakończenie", "nazwa": "Policjant w drzwiach", "tag": ["Policjant", "mundur"], "opis": "Stoi w drzwiach z pismem z prokuratury.", "kto": null, "scena": [["n", "W piątek nauczyciel znalazł u ucznia pierwszej klasy wkłady z HHCP-O."], ["n", "Chłopak kupił je od Kuby w czwartek. Od środy to już przestępstwo."], ["n", "Mama Kuby powiedziała policji, że syn chodzi do ciebie."], ["n", "Prokurator żąda dokumentacji Kuby i wzywa cię na świadka: środa, 10:00."]], "scena_S": ["d", "Za policjantem stoi dyrektor szkoły. Patrzy na ciebie."], "akcja": "Odpowiedz policjantowi", "prompt": [["n", "Prokurator żąda dokumentacji Kuby i wzywa cię na świadka: środa, 10:00."]], "art": "d5", "art_dec": "d5", "pomoc": {"tytul": "Co odpowiesz policjantowi?", "zanim": "Zanim odpowiesz policjantowi", "fakty": [["Zeznania: możesz odmówić. Ale nie zawsze.", "Psycholog może odmówić zeznań o tym, co objęte tajemnicą zawodową, „chyba że sąd lub prokurator dla dobra wymiaru sprawiedliwości zwolni te osoby od obowiązku zachowania tajemnicy”. Po takim zwolnieniu trzeba zeznawać.", "art. 180 § 1 Kodeksu postępowania karnego"], ["Dokumenty: trzeba je wydać.", "Rzecz, która może być dowodem, „należy wydać na żądanie sądu lub prokuratora” (art. 217 § 1). Gdy powiesz, że dokument zawiera tajemnicę zawodową, trafi do prokuratora „w opieczętowanym opakowaniu”: policjant go nie czyta (art. 225 § 1).", "Kodeks postępowania karnego"]], "pasek": null}, "opcje": [{"k": "A", "t": "Odmawiam zeznań. Także wtedy, gdy prokurator zwolni mnie z tajemnicy.", "kr": "Odmawiam zeznań, nawet po zwolnieniu z tajemnicy", "czyn": true}, {"k": "B", "t": "Oddaję dokumenty i mówię wszystko. To przecież prokurator.", "kr": "Oddaję dokumenty i mówię wszystko", "czyn": true}, {"k": "C", "t": "Niszczę notatkę z wtorku.", "kr": "Niszczę notatkę", "czyn": true}, {"k": "D", "t": "Dokumenty oddaję w zapieczętowanej kopercie. Zeznam dopiero, gdy zwolnią mnie z tajemnicy.", "kr": "Dokumenty w kopercie, zeznania po zwolnieniu z tajemnicy", "czyn": true}], "skutek": {"A_SG": [["n", "Środa, 10:00. Prokurator zwalnia cię z tajemnicy."], ["m", "— Odmawiam — powtarzasz."], ["n", "Dwa tygodnie później dostajesz karę: 3000 zł. I ostrzeżenie, że za dalszą odmowę grozi areszt do 30 dni."]], "A_P": [["n", "Środa, 10:00."], ["m", "— Odmawiam."], ["n", "Prokurator sięga po ustawę o ochronie zdrowia psychicznego. Czyta artykuł 52. Zamyka akta."], ["m", "— Nie mam pytań."]], "B": [["n", "Podpisujesz protokół: dokumenty wydane. W środę zeznajesz przez czterdzieści minut. Wszystko, co mówił Kuba, jest teraz w aktach sprawy. Twoimi słowami."]], "C": [["n", "Niszczarka pracuje sześć sekund. W środę prokurator pyta o dokumentację. Odpowiadasz, że jej nie ma. Pyta, od kiedy."]], "D_SG": [["n", "Koperta, pieczęć, podpis. Dwa dni później przychodzi pismo: prokurator zwalnia cię z tajemnicy. W środę zeznajesz. Kuba przeczyta twoje zeznania w aktach."]], "D_P": [["n", "Koperta, pieczęć, podpis. W środę odpowiadasz na pytania o przebieg leczenia. Na pytanie, co Kuba mówił o sprzedaży, powołujesz się na artykuł 52 ustawy o ochronie zdrowia psychicznego. Prokurator przechodzi do następnego pytania."]]}, "notatka": {"B": "W twojej notatce z wtorku są słowa Kuby o sprzedaży i o piątkowej jeździe.", "D": "W twojej notatce z wtorku jest pięć zdań. Jedno mówi o planie jazdy po paleniu.", "C": "Twój prywatny zeszyt też trzeba wydać, jeśli zażąda go sąd lub prokurator.", "A": "W twojej notatce z wtorku jest jedno zdanie: że Kuba pali marihuanę."}, "art_sk": {"A": "d5", "B": "d5", "C": "d5", "D": "d5"}, "kol": "miejsca", "oceny": {"A": {"S": "no", "P": "ok", "G": "no", "K": "ok"}, "B": {"S": "no", "P": "no", "G": "no", "K": "no"}, "C": {"S": "no", "P": "no", "G": "no", "K": "q"}, "D": {"S": "ok", "P": "ok", "G": "ok", "K": "ok"}}, "podstawy": {"A": {"S": "Po zwolnieniu z tajemnicy odmowa zeznań jest bezpodstawna: grozi za nią kara pieniężna do 3000 zł, a przy dalszym uporze areszt do 30 dni (art. 287 § 1–2 w związku z art. 285 § 1 Kodeksu postępowania karnego).", "G": "Po zwolnieniu z tajemnicy odmowa zeznań jest bezpodstawna: grozi za nią kara pieniężna do 3000 zł, a przy dalszym uporze areszt do 30 dni (art. 287 § 1–2 w związku z art. 285 § 1 Kodeksu postępowania karnego).", "P": "„Nie wolno przesłuchiwać osób obowiązanych do zachowania tajemnicy […] jako świadków na okoliczność wypowiedzi osoby […] co do popełnienia przez nią czynu zabronionego pod groźbą kary.” (art. 52 ust. 1 ustawy o ochronie zdrowia psychicznego). Tego zakazu nie uchyla ani prokurator, ani sąd.", "K": "Słowa Kuby o sprzedaży nie trafiają do akt z twoich ust."}, "B": {"S": "Bez zwolnienia z tajemnicy to jej ujawnienie wbrew ustawie (art. 14 ustawy o zawodzie psychologa z 2001 r.; art. 266 § 1 Kodeksu karnego).", "G": "Bez zwolnienia z tajemnicy to jej ujawnienie wbrew ustawie (art. 14 ustawy o zawodzie psychologa z 2001 r.; art. 266 § 1 Kodeksu karnego).", "P": "Samą dokumentację medyczną udostępnia się prokuraturze (art. 26 ust. 3 pkt 3 ustawy o prawach pacjenta). Ale o tym, co Kuba mówił o popełnieniu czynu zabronionego, zeznawać nie wolno (art. 52 ust. 1 ustawy o ochronie zdrowia psychicznego).", "K": "Wszystko, co mówił Kuba, jest w aktach sprawy. Twoimi słowami."}, "C": {"S": "Zniszczenie dokumentu, którym nie masz prawa wyłącznie rozporządzać: do 2 lat pozbawienia wolności (art. 276 Kodeksu karnego).", "G": "Zniszczenie dokumentu, którym nie masz prawa wyłącznie rozporządzać: do 2 lat pozbawienia wolności (art. 276 Kodeksu karnego).", "P": "Zniszczenie dokumentu, którym nie masz prawa wyłącznie rozporządzać: do 2 lat pozbawienia wolności (art. 276 Kodeksu karnego).", "K": "Nie ma jednej odpowiedzi. Kodeks Polskiego Towarzystwa Psychologicznego z 1991 r. zalecał komisyjne zniszczenie materiałów poufnych. Kodeks z 2018 r. tego zdania już nie zawiera."}, "D": {"S": "Rzecz mogącą stanowić dowód „należy wydać na żądanie sądu lub prokuratora” (art. 217 § 1 Kodeksu postępowania karnego). Dokument z tajemnicą zawodową trafia do prokuratora „w opieczętowanym opakowaniu” (art. 225 § 1). Zeznania składa się dopiero po zwolnieniu z tajemnicy (art. 180 § 1).", "G": "Rzecz mogącą stanowić dowód „należy wydać na żądanie sądu lub prokuratora” (art. 217 § 1 Kodeksu postępowania karnego). Dokument z tajemnicą zawodową trafia do prokuratora „w opieczętowanym opakowaniu” (art. 225 § 1). Zeznania składa się dopiero po zwolnieniu z tajemnicy (art. 180 § 1).", "P": "Dokumenty trafiają do prokuratora „w opieczętowanym opakowaniu” (art. 225 § 1 Kodeksu postępowania karnego). O tym, co Kuba mówił o popełnieniu czynu zabronionego, zeznawać nie wolno (art. 52 ust. 1 ustawy o ochronie zdrowia psychicznego). O reszcie: po zwolnieniu z tajemnicy (art. 180 Kodeksu postępowania karnego).", "K": "O tajemnicy decyduje pisemne postanowienie, a nie rozmowa w drzwiach. Cena poza poradnią: po zwolnieniu z tajemnicy zeznajesz."}}}], "SRODA": {"dzien": "środa", "godz": "8:00", "dalej": "czwartek, 12:15", "art": "sr", "tel": [["d", "Powiadomienie w telefonie:"], ["pow", "Od dziś HHCP-O jest w wykazie nowych substancji psychoaktywnych."], ["n", "Do wczoraj za jego sprzedaż groziła kara pieniężna. Od dziś to przestępstwo."], ["n", "Kuba o tym nie wie."]]}, "EPI": {"dzien": "wtorek", "godz": "16:40", "wstep": "Minął tydzień. Oto, co wynikło z twoich pięciu decyzji.", "tytul": {"plus": "Kuba pisze do ciebie.", "minus": "Kuba nie przyszedł."}, "pismo": "Na twoim biurku leży urzędowe pismo.", "sekcje": ["Co z Kubą", "Co w jego domu", "Co z tobą", "Twoje pięć decyzji"], "kuba": {"plus_sms": "Mogę przyjść?", "plus": "Nadal ci ufa.", "los": {"F1": "Kuba przyjeżdża autobusem. Prawo jazdy zabrała mu policja.", "F2": "Kuba pisze ze szpitalnego korytarza. Bartek leży dwa piętra wyżej.", "F3": "Kuba przychodzi punktualnie. Pierwszy raz."}, "uprzedzony": "— Jestem wściekły. Ale wiedziałem, że tak zrobisz. Mówiliśmy o wyjątkach.", "minus": "Kuba przestał ci ufać. Jego mama odwołała wszystkie wizyty. Na twoje wiadomości nikt nie odpowiada.", "zarzut": "Prokurator stawia Kubie zarzut: w czwartek sprzedał HHCP-O osobie niepełnoletniej. Grozi za to od 3 do 20 lat pozbawienia wolności, a w wypadku mniejszej wagi: do 2 lat.", "wypadek": "Za wypadek z ciężkimi obrażeniami, spowodowany pod wpływem środka odurzającego, grozi co najmniej 3 lata pozbawienia wolności.", "art72": {"plus": "Jest też szansa: jeśli Kuba będzie się dalej leczył, a jego czyn zostanie uznany za wypadek mniejszej wagi, prokurator może zawiesić postępowanie (art. 72 ustawy o przeciwdziałaniu narkomanii).", "minus": "Prokurator może zawiesić postępowanie wobec kogoś, kto się leczy (art. 72 ustawy o przeciwdziałaniu narkomanii). Kuba już się nie leczy."}}, "rodzina": {"A": "Mama Kuby do dziś nie wie, co było w pudełku z jego plecaka.", "B": "Na 16:00 byliście umówieni we troje: ty, Kuba i jego mama. Nikt nie przyszedł.", "C": "Od czwartku, kiedy mama Kuby usłyszała od ciebie wszystko, w ich domu nikt ze sobą nie rozmawia.", "D": "Na szafce z lekami taty wisi kłódka. Nikt nie powiedział Kubie dlaczego."}, "ty": {"C": "Dostajesz wezwanie. Jesteś osobą podejrzaną o zniszczenie dokumentu (art. 276 Kodeksu karnego: do 2 lat pozbawienia wolności).", "B": "Pełnomocnik rodziny Kuby składa wniosek o ściganie cię za ujawnienie tajemnicy bez zwolnienia z niej (art. 266 § 1 Kodeksu karnego).", "A": "Dostajesz postanowienie: kara porządkowa 3000 zł za odmowę zeznań.", "wszystko": "Wpływa na ciebie skarga: w dokumentacji leczenia zapisano przyznanie się Kuby do czynu zabronionego. Zakazuje tego art. 51 ustawy o ochronie zdrowia psychicznego.", "brak": "Do ciebie nie przyszło żadne pismo."}, "zbiory": ["zgodne z prawem", "dobre dla Kuby"], "kropki": ["wtorek, 16:40", "wtorek, 19:10", "czwartek, 12:15", "piątek, 21:40", "poniedziałek, 9:05"], "licznik": ["Zgodne z prawem", "Dobre dla Kuby", "Jedno i drugie naraz"], "wskazowka": "Stuknij decyzję, żeby zobaczyć przepis.", "jeszcze": "Zagraj jeszcze raz w innym miejscu pracy"}};
// polska typografia: jednoliterowe spójniki i przyimki nie zostają na końcu wiersza; nazwy z łącznikiem się nie łamią
(function typ(o){for(const k in o){const v=o[k];
  if(typeof v==='string')o[k]=v.replace(/(^|[\s(„])([aiouwzAIOUWZ])[ \t\n]+(?=\S)/g,'$1$2\u00a0').replace(/(^|[\s(„])([aiouwzAIOUWZ])[ \t\n]+(?=\S)/g,'$1$2\u00a0').replace(/(art\.|ust\.|pkt|§) (?=[\dIVX§])/g,'$1\u00a0').replace(/(\d) (?=\d{3}\b|zł|lat\b|dni\b|z\u00a05)/g,'$1\u00a0')

const QS=(()=>{try{return new URLSearchParams(location.search)}catch(e){return new URLSearchParams('')}})();
const MOCK=QS.get('mock')==='1', KANAL=/^[a-z0-9]{3,12}$/.test(QS.get('kanal')||'')?QS.get('kanal'):'', PROBA=MOCK||!!KANAL;
const magazyn=()=>PROBA?sessionStorage:localStorage;

/* ---------- klocki ---------- */
function hud(dzien,godz,nr,teraz){
  let p='';for(let i=1;i<=5;i++)p+=`<u class="${i<nr||(i===nr&&!teraz)?'byla':(i===nr?'teraz':'')}"></u>`;
  const ile=teraz?`decyzja ${nr} z 5`:`za tobą ${Math.min(nr,5)} z 5 decyzji`;
  return `<div class="hud"><div class="data"><b>${dzien}</b><i>${godz}</i></div><div class="stan" role="img" aria-label="${T.MIEJSCA[st.m][0]}, ${ile}"><span>${T.MIEJSCA[st.m][0]}</span>${p}</div></div>`}
function kadr(nazwa,alt){const k=KADR[nazwa], n=RUCH.klatek;
  const ruch=(RUCH.ruch[k.plik]||[]).map(r=>`<i aria-hidden="true" style="left:calc(50% - ${(k.x+65-r.x)*3}px);top:${(r.y-k.y)*3}px;width:${r.w*3}px;height:${r.h*3}px;background-image:url(${r.d});background-size:${r.w*3}px ${r.h*3*n}px;--koniec:${-r.h*3*n}px"></i>`).join('');
  return `<div class="kadr"><img src="${Z[k.plik]}" alt="${alt}" style="left:calc(50% - ${(k.x+65)*3}px);top:${-k.y*3}px">${ruch}</div>`}
function linie(a){return a.map(l=>{const k=l[0];
  if(k==='sms')return `<div class="sms">${l[1]}</div>`;
  if(k==='pow')return `<div class="pow"><b>Dziennik Ustaw</b>${l[1]}</div>`;
  if(k==='dm')return `<p class="dm"><span>${l[1]}</span> ${l[2]}</p>`;
  return `<p class="${k}">${l[1]}</p>`}).join('')}
function tag(d){if(!d.tag)return '<div class="bezkto"></div>';
  return `<span class="kto ${d.tag[1]}">${d.tag[0]}</span>`+(d.opis?`<p class="d">${d.opis}</p>`:'')}
function fakty(d){const p=d.pomoc,o=st.o[d.id]?1:0;
  const s=p.fakty.map(f=>`<h3>${f[0]}</h3><p>${f[1]}</p>${f[2]?`<cite>${f[2]}</cite>`:''}`).join('')+(p.pasek?`<div class="pasek ${p.pasek[1]}">${p.pasek[0]}</div>`:'');
  return `<div class="fakty" data-o="${o}"><button type="button" id="f-${d.id}" aria-expanded="${o?'true':'false'}" data-akcja="fakty" data-id="${d.id}"><span>Zanim wybierzesz: dwa fakty</span><img src="${Z.chev_ink}" alt=""></button>${o?`<div class="srodek">${s}</div>`:''}</div>`}
function tekstOpcji(d,o){return o.t}
function opcje(d){return `<div class="wybor">`+d.opcje.map(o=>`<button type="button" id="o-${d.id}-${o.k}" data-akcja="wybor" data-id="${d.id}" data-k="${o.k}"><b>${o.k}</b><span>${tekstOpcji(d,o)}${o.n?` <i>${o.n}</i>`:''}</span></button>`).join('')+`</div>`}
function odnowa(){return `<button type="button" class="odnowa" id="odnowa" data-akcja="odnowa">${st.o.reset?'Na pewno? Stuknij jeszcze raz':'Zacznij od nowa'}</button>`}
function dalej(etykieta){return `<div class="dalej"><p>${T.NA_EKRAN}</p><button type="button" id="dalej" data-akcja="dalej"><span>Dalej: ${etykieta}</span><img src="${Z.arrow_amber}" alt=""></button></div>`}
const ALT={d1_A:'Gabinet o zmierzchu. Kuba siedzi na krześle ze spuszczoną głową. Za szybą drzwi stoi jego mama.',d1_B:'Kuba patrzy na ciebie. Za szybą drzwi stoi jego mama.',d1_C:'Kuba patrzy na ciebie zmrużonymi oczami.',d1_D:'Kuba patrzy na ciebie z zaciśniętą szczęką.',
 d2:'Gabinet wieczorem. Puste krzesło. Na biurku świeci ekran laptopa z pustym polem notatki.',sr:'Gabinet rano. Puste krzesło.',d3:'Gabinet w południe. Na biurku dzwoni telefon.',
 d4:'Noc, deszcz, osiedle bloków. Kuba w kapturze stoi przy aucie z włączonymi światłami. Po drugiej stronie auta stoi Bartek.',
 d5:'Gabinet rano. W otwartych drzwiach stoi policjant z pismem w ręce.',d5_S:'Gabinet rano. W otwartych drzwiach stoi policjant z pismem w ręce. Za nim dyrektor szkoły.',
 ep_sms:'Gabinet o zmierzchu. Puste krzesło. Na biurku świeci ekran telefonu.',ep_sms_pismo:'Gabinet o zmierzchu. Puste krzesło. Na biurku świeci ekran telefonu i leży pismo z pieczęcią.',
 ep_pusto:'Gabinet o zmierzchu. Krzesło jest puste.',ep_pusto_pismo:'Gabinet o zmierzchu. Krzesło jest puste. Na biurku leży pismo z pieczęcią.'};

/* ---------- ekrany ---------- */
function eStart(){const n=T.START.length-1;
  return `<div class="tytul"><h1>Nikomu<br>nie mów</h1><p>${T.PODTYTUL_GRY}</p>${STAT?`<p class="stat">${T.STAT_INFO}</p>`:''}</div>`+kadr('d1_A',ALT.d1_A)+
  `<div class="tresc"><div class="bezkto"></div>${T.START.map((t,i)=>`<p class="${i<n?'n':'pyt'}">${t}</p>`).join('')}
  <div class="wybor miejsca">${['S','P','G'].map(m=>`<button type="button" id="m-${m}" data-akcja="miejsce" data-m="${m}"><span>${T.MIEJSCA[m][1]}<small>${T.MIEJSCA[m][2]}</small></span><img src="${Z.arrow_amber}" alt=""></button>`).join('')}</div></div>`}
function artSceny(d){return (d.id==='d5'&&st.m==='S')?'d5_S':d.art}
function eScena(d){const dod=(d.scena_S&&st.m==='S')?[d.scena_S]:[];
  return hud(d.dzien,d.godz,d.nr,true)+kadr(artSceny(d),ALT[artSceny(d)])+`<div class="tresc">${tag(d)}${linie(d.scena.concat(dod))}
  <button type="button" class="glowny" id="akcja" data-akcja="dalej"><span>${d.akcja}</span><img src="${Z.arrow_ink}" alt=""></button>${odnowa()}</div>`}
function eDecyzja(d){const a=(d.id==='d5'&&st.m==='S')?'d5_S':d.art_dec;
  const kto=d.id==='d4'?d.tag[0]:d.kto;
  const gora=(kto?`<span class="kto ${d.tag[1]}">${kto}</span>`:'<div class="bezkto"></div>')+linie(d.prompt);
  return hud(d.dzien,d.godz,d.nr,true)+kadr(a,ALT[a])+`<div class="tresc">${gora}${fakty(d)}${opcje(d)}${odnowa()}</div>`}
function wariant(d,k){ // tekst skutku zależny od miejsca pracy i od wtorkowej notatki
  if(d.id!=='d5')return d.skutek[k];
  const P=st.m==='P',S=d.skutek;
  if(k==='A')return S[P?'A_P':'A_SG'];
  if(k==='B')return S.B;
  if(k==='C')return S.C;
  return S['D_'+(P?'P':'SG')]}
function eSkutek(d){const k=st.w[d.id],kk=k,o=d.opcje.find(x=>x.k===kk);
  const a=(d.id==='d5'&&st.m==='S')?'d5_S':d.art_sk[kk];
  let s=hud(d.dzien,d.godz,d.nr,false)+kadr(a,ALT[a])+`<div class="tresc"><span class="kto ty">Ty</span><p class="echo">${tekstOpcji(d,o)}${o.n?' '+o.n:''}</p>`;
  s+=(d.kto&&d.id!=='d4'?`<span class="kto luz ${d.tag[1]}">${d.kto}</span>`:'<div class="bezkto"></div>')+linie(wariant(d,k));
  if(d.id==='d4'){const L=d.los[st.f];s+=`<div class="czas">${L.kiedy}</div>`+(L[k]?`<p class="d">${L[k]}</p>`:'');
    s+=L.sms?`<span class="kto luz bordo">${L.kto}</span><div class="sms">${L.sms}</div>`:`<div class="dzwoni"><i></i><span>${L.kto}</span></div><p class="n">${L.tekst}</p>`}
  if(d.id==='d5'&&k!=='C')s+=`<p class="d" style="margin-top:9px">${d.notatka[NOTK[st.not]]}</p>`;
  return s+dalej(d.dalej)+odnowa()+`</div>`}
function eSroda(){const s=T.SRODA;return hud(s.dzien,s.godz,2,false)+kadr('sr',ALT.sr)+`<div class="tresc"><div class="bezkto"></div>${linie(s.tel)}${dalej(s.dalej)}${odnowa()}</div>`}
function ocena(d,k){const o=d.oceny[k];return {L:d.kol==='miejsca'?o[st.m]:o.L,K:o.K}}
function podstawa(d,k){const p=d.podstawy[k];return {L:d.kol==='miejsca'?p[st.m]:(p['L'+st.m]||p.L),K:p.K}}
const SLOWO={ok:T.LEGENDA[0],no:T.LEGENDA[1],q:T.LEGENDA[2]};
function eEpilog(){const E=T.EPI,plus=st.z>=0,w=st.w,art='ep_'+(plus?'sms':'pusto')+(st.pismo?'_pismo':'');
  let s=hud(E.dzien,E.godz,5,false)+kadr(art,ALT[art])+`<div class="tresc ep"><p class="wstep">${E.wstep}</p><h1>${plus?E.tytul.plus:E.tytul.minus}${st.pismo?' '+E.pismo:''}</h1>`;
  s+=`<h2>${E.sekcje[0]}</h2>`;
  if(plus){s+=`<div class="sms" style="margin-top:9px">${E.kuba.plus_sms}</div><p class="n">${E.kuba.los[st.f]} ${E.kuba.plus}</p>`;
    if(st.up&&(w.d4==='A'||w.d4==='D'))s+=`<p class="m">${E.kuba.uprzedzony}</p>`}
  else s+=`<p class="n">${E.kuba.minus}</p>`;
  s+=`<p class="n">${E.kuba.zarzut}</p>`+(st.f==='F2'?`<p class="n">${E.kuba.wypadek}</p>`:'')+`<p class="d">${E.kuba.art72[plus?'plus':'minus']}</p>`;
  s+=`<h2>${E.sekcje[1]}</h2><p class="n">${E.rodzina[st.mama]}</p>`;
  let ty=E.ty.brak;
  if(w.d5==='C')ty=E.ty.C;else if(w.d5==='B')ty=E.ty.B;else if(w.d5==='A'&&st.m!=='P')ty=E.ty.A;
  else if(st.not==='wszystko'&&st.m==='P')ty=E.ty.wszystko;
  s+=`<h2>${E.sekcje[2]}</h2><p class="n" id="ty">${ty}</p>`;
  // pięć decyzji: liczby i lista
  let nL=0,nK=0,nO=0;const wier=[];
  T.D.forEach((d,i)=>{const k=w[d.id],oc=ocena(d,k);if(oc.L==='ok')nL++;if(oc.K==='ok')nK++;if(oc.L==='ok'&&oc.K==='ok')nO++;
    const otw=st.o.kropka===d.id,o=d.opcje.find(x=>x.k===k),pd=podstawa(d,k);
    wier.push(`<div class="wiersz" data-o="${otw?1:0}"><button type="button" id="w-${d.id}" data-akcja="kropka" data-id="${d.id}" aria-expanded="${otw}"><b>${i+1}</b><span><small>${E.kropki[i]}: ${mala(d.nazwa)}</small>${o.kr}</span><img src="${Z['mark_'+oc.L]}" alt="${T.PYTANIA[0]} ${wielka(SLOWO[oc.L])}."><img src="${Z['mark_'+oc.K]}" alt="${T.PYTANIA[1]} ${wielka(SLOWO[oc.K])}."></button>`+
      (otw?`<div class="wiecej"><h4 class="l">${T.PYTANIA[0].slice(0,-1)}${d.kol==='miejsca'?' ('+T.MIEJSCA[st.m][0]+')':''}? ${wielka(SLOWO[oc.L])}.</h4><p>${pd.L}</p><h4 class="k">${T.PYTANIA[1]} ${wielka(SLOWO[oc.K])}.</h4><p>${pd.K}</p>${d.dopisek?`<p class="dop">${d.dopisek}</p>`:''}</div>`:'')+`</div>`)});
  s+=`<h2>${E.sekcje[3]}</h2><div class="licz"><p class="l"><span>${E.licznik[0]}</span><b id="n-l">${nL} z 5</b></p><p class="k"><span>${E.licznik[1]}</span><b id="n-k">${nK} z 5</b></p><p class="o"><span>${E.licznik[2]}</span><b id="n-o">${nO} z 5</b></p></div>
   <p class="d" style="margin-bottom:9px">${E.wskazowka}</p><div class="glowka"><span>prawo</span><span>Kuba</span></div><div class="lista">${wier.join('')}</div>
   <div class="legenda"><span><img src="${Z.mark_ok}" alt="">${SLOWO.ok}</span><span><img src="${Z.mark_no}" alt="">${SLOWO.no}</span><span><img src="${Z.mark_q}" alt="">${SLOWO.q}</span></div>
   <button type="button" class="glowny" id="jeszcze" data-akcja="jeszcze"><span>${E.jeszcze}</span><img src="${Z.arrow_ink}" alt=""></button>
   <p class="zakres">${T.ZAKRES}</p></div>`;
  return s}

/* ---------- reguły ---------- */
function wybierz(id,k){const m=st.m;
  if(id==='d1'){if(k==='A'){st.z+=1;st.ob=true}else if(k==='C'){st.z+=1;st.up=true}else if(k==='D')st.z-=1}
  if(id==='d2'){st.not=NOT[k];if(k==='B'&&m==='P')st.pismo=true}
  if(id==='d3'){st.z+={A:1,B:1,C:-2,D:-1}[k];st.mama=k}
  if(id==='d4'){if(k==='A')st.z+=st.up?-1:(st.ob?-3:-2);else if(k==='B')st.z+=1;else if(k==='D')st.z+=st.up?0:(st.ob?-2:-1);
    st.f=(window.__los||['F1','F2','F3'][Math.floor(Math.random()*3)])}
  if(id==='d5'){
    if(k==='A')st.z+=1;else if(k==='B')st.z-=2;else if(k==='D')st.z+=(m==='P'?0:-1);
    if(k==='B'||k==='C'||(k==='A'&&m!=='P'))st.pismo=true}
  st.w[id]=k}
/* ---------- zliczanie odpowiedzi sali ----------
   Telefon wysyła anonimowo: losowy identyfikator urządzenia, miejsce pracy, pierwszą odpowiedź na każdą z pięciu decyzji,
   wylosowane zakończenie piątku i to, jak skończył się tydzień. Bez imienia, konta i numeru telefonu.
   Każda wiadomość zawiera cały dotychczasowy zapis, więc zgubiona wiadomość naprawia się przy następnej.
   W jednym „głosowaniu” (STAT.cykl godzin) liczy się pierwsza odpowiedź na każdą decyzję; powtórne przejście gry nie jest wysyłane.
   Gdy wysyłka zawiedzie, gra działa dalej bez zmian. Wyniki pokazuje strona wyniki/ (src/wyniki.tpl.html).
   Serwis ntfy.sh ogranicza liczbę żądań z jednego adresu, dlatego telefon nie ponawia w kółko:
   po trzech odmowach serwera albo dwunastu nieudanych połączeniach przestaje (do ponownego otwarcia strony albo powrotu sieci). */
const stat=(()=>{
  if(!STAT||typeof fetch!=='function')return {zglos(){},pchnij(){},stan:()=>null};
  const KL='nnm-stat',temat=STAT.temat+'-'+(KANAL||'a'),IDS=['d1','d2','d3','d4','d5'];
  let s=null,wLocie=false,proby=0,odmowy=0,bledy=0,pauza=0,zegar=null;
  const teraz=()=>Math.floor(Date.now()/1000);
  const pusty=()=>({m:null,w:{},f:null,e:null});
  function czytaj(){try{const x=JSON.parse(magazyn().getItem(KL)||'null');if(x&&/^[a-z0-9]{6,16}$/.test(x.pid)&&x.r&&x.r.w)return x}catch(e){}return null}
  function pisz(){try{magazyn().setItem(KL,JSON.stringify(s))}catch(e){}}
  function stan(){if(!s)s=czytaj()||{pid:(Math.random().toString(36).slice(2,12)+'0000000000').slice(0,10),c:0,n:0,ok:0,r:pusty()};return s}
  function nadaj(tresc){
    if(MOCK){   // tryb próbny bez internetu: wiadomości leżą w pamięci przeglądarki, strona wyników w innej karcie czyta je stamtąd
      const w={id:Math.random().toString(36).slice(2),time:teraz(),event:'message',topic:temat,message:tresc};let l=[];
      try{l=JSON.parse(localStorage.getItem('nnm-mock:'+temat)||'[]')}catch(e){}
      l.push(w);localStorage.setItem('nnm-mock:'+temat,JSON.stringify(l));
      try{const bc=new BroadcastChannel('nnm-mock');bc.postMessage(w);bc.close()}catch(e){}
      return Promise.resolve()}
    // keepalive: wysyłka kończy się także wtedy, gdy ktoś od razu zablokuje telefon; przy ponowieniu już bez tej opcji
    return fetch(STAT.url+temat,{method:'POST',body:tresc,keepalive:!proby}).then(r=>{if(!r.ok){const e=new Error('HTTP '+r.status);e.odmowa=true;throw e}})}
  function plan(ms){clearTimeout(zegar);zegar=setTimeout(pchnij,ms)}
  const dosc=()=>odmowy>=3||bledy>=12;
  function pchnij(){const x=stan();if(wLocie||x.ok>=x.n||dosc()||Date.now()<pauza)return;wLocie=true;const c=x.c,n=x.n;let p;
    try{p=nadaj(JSON.stringify({t:'nnm',v:1,pid:x.pid,c,n,m:x.r.m,w:x.r.w,f:x.r.f,e:x.r.e}))}catch(e){p=Promise.reject(e)}
    const koniec=()=>{wLocie=false;if(x.ok>=x.n||dosc())return;
      if(Date.now()<pauza)plan(pauza-Date.now()+500);                      // po odmowie serwera: jedna próba po przerwie
      else if(proby&&proby<4)plan(3000*Math.pow(2,proby-1));               // brak sieci: po 3, 6 i 12 s, potem przy następnym ruchu gracza
      else if(!proby)plan(0)};                                              // w trakcie wysyłki doszła nowa odpowiedź
    p.then(()=>{proby=0;odmowy=0;bledy=0;if(x.c===c&&x.ok<n){x.ok=n;pisz()}},e=>{if(e&&e.odmowa){odmowy++;pauza=Date.now()+30000}else{proby++;bledy++}}).then(koniec,koniec)}
  function zglos(){try{const x=stan();
    if(!st.m)return;                                                             // przed wyborem miejsca pracy nie ma czego wysyłać
    if(!x.c||teraz()-x.c>STAT.cykl*3600){x.c=teraz();x.n=0;x.ok=0;x.r=pusty()}   // nowe „głosowanie”
    let zm=false;
    if(x.r.m!==st.m&&!Object.keys(x.r.w).length){x.r.m=st.m;zm=true}             // miejsce pracy można poprawić, dopóki nie padła pierwsza odpowiedź
    for(const id of IDS){const k=st.w[id];if(k&&!x.r.w[id]){x.r.w[id]=k;zm=true;
      if(id==='d4')x.r.f=st.f;
      if(id==='d5')x.r.e={p:st.z>=0?1:0,s:st.pismo?1:0}}}                        // p: Kuba pisze do ciebie; s: urzędowe pismo na biurku
    if(zm){x.n++;proby=0;pisz()}
    pchnij()}catch(e){}}
  try{addEventListener('online',()=>{proby=0;bledy=0;pchnij()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){proby=0;pchnij()}})}catch(e){}
  return {zglos,pchnij,stan}})();
function rysuj(fokus){const e=st.e;let h;
  if(e==='start')h=eStart();else if(e==='sr')h=eSroda();else if(e==='ep')h=eEpilog();
  else{const d=D[e.slice(0,2)],t=e[2];h=t==='s'?eScena(d):(t==='d'?eDecyzja(d):eSkutek(d))}
  gra.innerHTML=h;gra.classList.remove('wej');void gra.offsetWidth;gra.classList.add('wej');
  if(fokus){const el=document.getElementById(fokus);if(el)el.focus({preventScroll:true})}else window.scrollTo(0,0)}
function idz(){let i=KOL.indexOf(st.e)+1;st.e=KOL[i];st.o={};zapisz();rysuj();stat.zglos()}
gra.addEventListener('click',ev=>{const b=ev.target.closest('button[data-akcja]');if(!b)return;const a=b.dataset.akcja;
  if(a!=='odnowa'&&st.o.reset){st.o.reset=false}
  if(a==='miejsce'){st=nowy();st.m=b.dataset.m;idz()}
  else if(a==='dalej')idz();
  else if(a==='wybor'){wybierz(b.dataset.id,b.dataset.k);idz()}
  else if(a==='fakty'){st.o[b.dataset.id]=!st.o[b.dataset.id];rysuj(b.id)}
  else if(a==='kropka'){st.o.kropka=st.o.kropka===b.dataset.id?null:b.dataset.id;rysuj('w-'+b.dataset.id)}
  else if(a==='jeszcze'){st=nowy();zapisz();rysuj()}
  else if(a==='odnowa'){if(st.o.reset){st=nowy();zapisz();rysuj()}else{st.o.reset=true;rysuj('odnowa')}}});
window.__stan=()=>st;
try{window.claude?.hot?.snapshot?.(()=>st)}catch(e){}
function start(d){if(d&&d.e&&KOL.includes(d.e))st=d;else{const s=wczytaj();if(s)st=s}if(!st.o)st.o={};rysuj();stat.pchnij()}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
</script>
