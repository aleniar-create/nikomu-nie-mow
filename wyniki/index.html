let kolejny=0;
function przyjmij(m){
  if(!m||m.event!=='message'||typeof m.id!=='string'||widziane.has(m.id))return false;
  widziane.add(m.id);
  let d;try{d=JSON.parse(m.message)}catch(e){return false}
  if(!d||typeof d!=='object')return false;
  const time=Number(m.time)||0, seq=kolejny++;
  if(d.t==='nnm0'){znaczniki.push({id:m.id,time,seq});return true}
  if(d.t==='nnm1'){if(typeof d.z==='string')cofniete.add(d.z);return true}
  if(d.t!=='nnm'||d.v!==1||typeof d.pid!=='string'||!/^[a-z0-9]{6,16}$/.test(d.pid)||!Number.isFinite(d.c)||!Number.isFinite(d.n)||wiadomosci.length>=4000)return false;
  const w={};if(d.w&&typeof d.w==='object')for(const id of IDS)if(LIT.includes(d.w[id]))w[id]=d.w[id];
  wiadomosci.push({pid:d.pid,c:d.c,n:d.n,time,seq,m:MIEJSCA.includes(d.m)?d.m:null,w,f:LOSY.includes(d.f)?d.f:null,
    e:(d.e&&typeof d.e==='object'&&(d.e.p===0||d.e.p===1))?{p:d.e.p,s:d.e.s===1?1:0}:null});
  return true}
function granica(){let g=null;for(const z of znaczniki)if(!cofniete.has(z.id)&&(!g||z.time>g.time||(z.time===g.time&&z.seq>g.seq)))g=z;return g}
function policz(){
  const g=granica(), naj=new Map();let ost=0;
  for(const x of wiadomosci){
    if(g&&(x.time<g.time||(x.time===g.time&&x.seq<g.seq)))continue;
    if(x.m&&x.time>ost)ost=x.time;
    const b=naj.get(x.pid);if(!b||x.c>b.c||(x.c===b.c&&x.n>=b.n))naj.set(x.pid,x)}
  const tel=[...naj.values()].filter(x=>x.m).slice(0,1000);
  const wyn={g,ost,n:tel.length,miejsca:{S:0,P:0,G:0},dec:{},los:{F1:0,F2:0,F3:0},kon:{n:0,plus:0,minus:0,pismo:0,l:0,k:0,o:0}};
  for(const d of W.D)wyn.dec[d.id]={a:0,A:0,B:0,C:0,D:0};
  for(const x of tel){wyn.miejsca[x.m]++;
    for(const d of W.D){const k=x.w[d.id];if(k){wyn.dec[d.id].a++;wyn.dec[d.id][k]++}}
    if(x.w.d4&&x.f)wyn.los[x.f]++;
    if(IDS.every(id=>x.w[id])&&x.e){const K=wyn.kon;K.n++;if(x.e.p)K.plus++;else K.minus++;if(x.e.s)K.pismo++;
      for(const d of W.D){const o=d.oceny[x.w[d.id]],L=d.kol==='miejsca'?o[x.m]:o.L;       // tak samo jak liczniki na telefonie
        if(L==='ok')K.l++;if(o.K==='ok')K.k++;if(L==='ok'&&o.K==='ok')K.o++}}}
  return wyn}

/* ---------- połączenie: ntfy.sh (jak w aplikacji warsztatowej) albo tryb próbny w tej samej przeglądarce ---------- */
let lacze='conn', ostatniZnak=0, es=null, zegarSondy=null, odstepSondy=5000, kiedyPolacz=0;
const podstawa=W.url+TEMAT;
function stanLacza(s){if(lacze!==s){lacze=s;rysujStan()}}
function nowe(lista){let zm=false;for(const m of lista)if(przyjmij(m))zm=true;if(zm)odswiez()}
function sonda(){   // jednorazowe pobranie wszystkiego, co serwer pamięta (zapas, gdy sieć nie przepuszcza odbioru na żywo)
  if(MOCK){let l=[];try{l=JSON.parse(localStorage.getItem('nnm-mock:'+TEMAT)||'[]')}catch(e){}nowe(l);return Promise.resolve(true)}
  return fetch(podstawa+'/json?poll=1&since=all').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
    .then(t=>{const l=[];for(const w of t.split('\n'))if(w.trim()){try{l.push(JSON.parse(w))}catch(e){}}nowe(l);return true})}
function planSondy(){clearTimeout(zegarSondy);zegarSondy=setTimeout(()=>{
  if(lacze==='ok'&&Date.now()-ostatniZnak<100000){planSondy();return}     // odbiór na żywo działa: serwer odzywa się co ok. 45 s
  sonda().then(()=>{odstepSondy=15000;if(lacze!=='ok')stanLacza('sonda')},()=>{odstepSondy=60000;stanLacza('err')}).then(planSondy);
  if((!es||es.readyState===2||Date.now()-ostatniZnak>=100000)&&Date.now()-kiedyPolacz>=60000)polacz()},odstepSondy)}   // serwer liczy żądania: bez pośpiechu
function polacz(){
  try{if(es)es.close()}catch(e){}
  kiedyPolacz=Date.now();if(typeof EventSource==='undefined'){es=null;return}
  es=new EventSource(podstawa+'/sse?since=all');ostatniZnak=Date.now();
  const zyje=()=>{ostatniZnak=Date.now();stanLacza('ok')};
  es.onopen=zyje;es.addEventListener('keepalive',zyje);
  es.onmessage=e=>{zyje();try{nowe([JSON.parse(e.data)])}catch(_){}};
  es.onerror=()=>{if(lacze==='ok'||lacze==='conn')stanLacza(es.readyState===2?'err':'conn')}}
function sluchaj(){
  if(MOCK){sonda();stanLacza('ok');
    try{new BroadcastChannel('nnm-mock').addEventListener('message',e=>{if(e.data&&e.data.topic===TEMAT)nowe([e.data])})}catch(e){}
    addEventListener('storage',e=>{if(e.key==='nnm-mock:'+TEMAT)sonda()});return}
  polacz();planSondy();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sonda().catch(()=>{})})}   // po powrocie z programu ze slajdami: upewnij się, że wynik jest aktualny
function nadaj(obj){
  const tresc=JSON.stringify(obj);
  if(MOCK){const w={id:Math.random().toString(36).slice(2),time:Math.floor(Date.now()/1000),event:'message',topic:TEMAT,message:tresc};let l=[];
    try{l=JSON.parse(localStorage.getItem('nnm-mock:'+TEMAT)||'[]')}catch(e){}
    l.push(w);localStorage.setItem('nnm-mock:'+TEMAT,JSON.stringify(l));
    try{const bc=new BroadcastChannel('nnm-mock');bc.postMessage(w);bc.close()}catch(e){}
    return Promise.resolve(w)}
  return fetch(podstawa,{method:'POST',body:tresc}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}

/* ---------- ekrany ---------- */
const EKRANY=['start',...IDS,'razem'], NAZWY=['Start',...W.D.map(d=>String(d.nr)),'Razem'];
let ekran=0, zero={pewnie:false,blad:false,wtoku:false}, zbudowany=null;
const tresc=$('tresc');
function kiedy(t){const d=new Date(t*1000),dzis=new Date(),hm=d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===dzis.toDateString()?'dziś, '+hm:d.toLocaleDateString('pl-PL',{day:'numeric',month:'numeric'})+', '+hm}
function kartka(gora,srodek,dol,ile){const k=$('kal');k.className='kal'+(ile?' ile':'');
  k.children[0].textContent=gora;k.children[0].className=gora.length>8?'dl':'';k.children[1].textContent=srodek;k.children[2].textContent=dol}
function wierszHtml(lit,etyk,dop,id){return `<li class="wiersz${lit?'':' bezkafla'}" id="w-${id}">${lit?`<b>${lit}</b>`:''}<p class="etyk">${etyk}${dop?` <i>${dop}</i>`:''}</p>
  <div class="liczby"><strong>0</strong><span>0%</span></div><div class="tor" aria-hidden="true"><u></u></div></li>`}
function ustawWiersz(id,c,a){const w=$('w-'+id);if(!w)return;const p=proc(c,a);
  w.querySelector('strong').textContent=c;w.querySelector('.liczby span').textContent=p+'%';w.querySelector('.tor u').style.width=(a?100*c/a:0)+'%';
  w.title=`${c} z ${a} ${telD(a)} (${p}%)`}
function buduj(){const e=EKRANY[ekran],h1=$('h1');zbudowany=e;h1.className='';
  if(e==='start'){h1.innerHTML=W.start;
    tresc.innerHTML=`<ul class="wiersze">${MIEJSCA.map(m=>wierszHtml('',W.miejsca[m],'',m)).join('')}</ul><p class="czekam" id="czekam" hidden>Czekam na pierwsze telefony.</p>
      <div class="zero" id="zero"></div><p class="podp">Strzałki ← → zmieniają ekran. Klawisz F włącza pełny ekran.</p>`}
  else if(e==='razem'){h1.innerHTML='Jak odpowiadała sala';
    tresc.innerHTML=`<div class="razem"><section><h2>Najczęstsza odpowiedź</h2><ol class="naj">${W.D.map((d,i)=>`<li id="n-${d.id}"><div class="lit"></div><div class="co"><small>${W.kropki[i]}: ${d.nazwa}</small><span></span></div><div class="ile"></div></li>`).join('')}</ol></section>
      <div class="prawa"><section><h2>Jak skończył się tydzień</h2><ul class="koniec">${[['plus',W.epi.plus],['minus',W.epi.minus]].map(([k,t])=>`<li id="k-${k}"><p class="etyk">${t}</p><strong>0</strong><div class="tor" aria-hidden="true"><u></u></div></li>`).join('')}</ul></section>
      <section><h2>Średnio w sali</h2><ul class="srednie">${['l','k','o'].map((k,i)=>`<li class="${k}" id="s-${k}"><span>${W.epi.licznik[i]}</span><b>—</b></li>`).join('')}</ul></section></div></div>`}
  else{const d=W.D[ekran-1];h1.innerHTML=d.pyt;
    tresc.innerHTML=`<ol class="wiersze">${d.opcje.map(o=>wierszHtml(o.k,o.t,o.n,o.k)).join('')}</ol><p class="czekam" id="czekam" hidden>Czekam na pierwsze odpowiedzi.</p>`+
      (d.id==='d4'?`<div class="piatek" id="piatek"><h2>Jak skończył się piątek:</h2>${LOSY.map(f=>`<span>${W.los[f]}<b id="l-${f}">0</b></span>`).join('')}</div>`:'')}
  // tytuł, który nie mieści się w jednym wierszu obok kartki, dostaje mniejszy krój; za długie odpowiedzi też
  if(h1.offsetHeight>(parseFloat(getComputedStyle(h1).lineHeight)||120)*1.5)h1.className='s84';
  tresc.className='';if(!waski()&&tresc.scrollHeight>tresc.clientHeight+1)tresc.className='ciasno';
  $('zakladki').innerHTML=NAZWY.map((n,i)=>`<button type="button" data-e="${i}" aria-current="${i===ekran}">${n}</button>`).join('')}
function rysujZero(wyn){const z=$('zero');if(!z)return;const g=wyn.g,podpis=[g&&g.id,zero.pewnie,zero.blad,zero.wtoku].join('|');
  const od=(g?'Liczę odpowiedzi od: '+kiedy(g.time)+'.':'Liczę wszystkie odpowiedzi z ostatnich 12 godzin.')+(wyn.ost?' Ostatnia odpowiedź: '+kiedy(wyn.ost)+'.':'');
  if(z.dataset.p===podpis){const e=z.querySelector('.od');if(e.textContent!==od)e.textContent=od;return}
  z.dataset.p=podpis;
  z.innerHTML=`<span class="od">${od}</span>
    <button type="button" class="glowny${zero.pewnie?' pewnie':''}" id="b-zero"${zero.wtoku?' disabled':''}>${zero.wtoku?'Chwila…':zero.pewnie?'Na pewno? Kliknij jeszcze raz':'Zacznij liczyć od zera'}</button>
    ${g&&!zero.wtoku?'<button type="button" class="cichy" id="b-cofnij">Cofnij zerowanie</button>':''}
    ${zero.blad?'<span class="blad">Nie udało się. Sprawdź internet i spróbuj jeszcze raz.</span>':''}`}
function rysujStan(){const l=$('lacze');l.className=lacze==='ok'||lacze==='sonda'?'ok':lacze==='err'?'err':'';
  l.children[1].innerHTML=(lacze==='ok'?'połączono':lacze==='sonda'?'połączono (odświeżanie co 15 s)':lacze==='err'?'brak połączenia':'łączę…')+(MOCK?'<em>tryb próbny</em>':KANAL?`<em>kanał próbny: ${bezp(KANAL)}</em>`:'')}
function odswiez(){if(odswiez.czeka)return;odswiez.czeka=true;requestAnimationFrame(()=>{odswiez.czeka=false;rysuj()})}
function rysuj(){const e=EKRANY[ekran];if(zbudowany!==e)buduj();const wyn=policz(),ile=$('ile'),cz=$('czekam');
  if(e==='start'){kartka('w grze',String(wyn.n),telM(wyn.n),true);
    for(const m of MIEJSCA)ustawWiersz(m,wyn.miejsca[m],wyn.n);
    if(cz)cz.hidden=wyn.n>0;rysujZero(wyn);ile.innerHTML=''}
  else if(e==='razem'){kartka(W.epi.dzien,W.epi.godz,'tydzień później');const K=wyn.kon;
    W.D.forEach(d=>{const s=wyn.dec[d.id],li=$('n-'+d.id),max=Math.max(...LIT.map(k=>s[k])),top=s.a?LIT.filter(k=>s[k]===max):[];
      li.querySelector('.lit').innerHTML=top.length?top.map(k=>`<b>${k}</b>`).join(''):'<b class="brak">?</b>';
      li.querySelector('.co span').innerHTML=!top.length?'jeszcze nikt nie odpowiedział':top.length===1?d.opcje.find(o=>o.k===top[0]).kr:(top.length===2?'dwie odpowiedzi':top.length===3?'trzy odpowiedzi':'cztery odpowiedzi')+' po równo';
      li.querySelector('.ile').textContent=top.length?proc(max,s.a)+'%':''});
    for(const k of ['plus','minus']){const li=$('k-'+k);li.querySelector('strong').textContent=K[k];li.querySelector('.tor u').style.width=(K.n?100*K[k]/K.n:0)+'%';li.title=`${K[k]} z ${K.n} ${telD(K.n)} (${proc(K[k],K.n)}%)`}
    for(const k of ['l','k','o'])$('s-'+k).querySelector('b').innerHTML=K.n?przec(K[k]/K.n)+'<small>z 5</small>':'—';
    ile.innerHTML=`Do końca gry: <b>${K.n}</b> z ${wyn.n} ${telD(wyn.n)}`}
  else{const d=W.D[ekran-1],s=wyn.dec[d.id];kartka(d.dzien,d.godz,`decyzja ${d.nr} z 5`);
    for(const k of LIT)ustawWiersz(k,s[k],s.a);
    if(cz)cz.hidden=s.a>0;
    if(d.id==='d4')for(const f of LOSY)$('l-'+f).textContent=wyn.los[f];
    ile.innerHTML=`Odpowiedzi: <b>${s.a}</b> z ${wyn.n} ${telD(wyn.n)}`}}
function idz(i){ekran=Math.max(0,Math.min(EKRANY.length-1,i));zero.pewnie=false;zero.blad=false;try{history.replaceState(null,'',location.pathname+location.search+'#'+ekran)}catch(e){}rysuj()}
function pelny(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function zeruj(){
  if(!zero.pewnie){zero.pewnie=true;zero.blad=false;rysuj();$('b-zero').focus();return}
  zero.pewnie=false;zero.wtoku=true;zero.blad=false;rysuj();
  nadaj({t:'nnm0',n:Math.random().toString(36).slice(2,10)}).then(m=>{zero.wtoku=false;if(m&&m.id)nowe([m]);rysuj()},()=>{zero.wtoku=false;zero.blad=true;rysuj()})}
function cofnij(){const g=granica();if(!g||zero.wtoku)return;zero.pewnie=false;zero.wtoku=true;zero.blad=false;rysuj();
  nadaj({t:'nnm1',z:g.id}).then(m=>{zero.wtoku=false;if(m&&m.id)nowe([m]);rysuj()},()=>{zero.wtoku=false;zero.blad=true;rysuj()})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e!==undefined){idz(Number(b.dataset.e));const n=document.querySelector('#zakladki button[aria-current="true"]');if(n)n.focus()}
  else if(b.id==='b-zero')zeruj();else if(b.id==='b-cofnij')cofnij()});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!(document.activeElement&&document.activeElement.tagName==='BUTTON'))){e.preventDefault();idz(ekran+1)}   // strzałka, pilot do slajdów, spacja
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();idz(ekran-1)}
  else if(k==='Home')idz(0);else if(k==='End')idz(EKRANY.length-1);
  else if(/^[0-6]$/.test(k))idz(Number(k));
  else if(k==='f'||k==='F')pelny()});
const waski=()=>matchMedia('(max-aspect-ratio:1/1),(max-width:719px)').matches;
function skala(){document.documentElement.style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080))}
addEventListener('resize',skala);skala();
const h=/^#([0-6])$/.exec(location.hash);ekran=h?Number(h[1]):0;
rysuj();rysujStan();sluchaj();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{zbudowany=null;rysuj()});   // po wczytaniu kroju: ponowny pomiar tytułu
window.__wyniki=()=>policz();
</script>
</body></html>
